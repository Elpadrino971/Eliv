# Déploiement du site vitrine Vybzzz (dossier /site) sur Netlify.
# Le reste du repo (app Flutter) est ignoré : seul /site est publié.
[build]
  publish = "site"
  command = ""

# En-têtes simples
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
