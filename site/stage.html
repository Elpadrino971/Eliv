<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Stage VybzzZ</title>
<meta name="description" content="Écran projeté sur scène (v2) : mur de fans, cadeaux en héros, classement permanent et objectif collectif — sans aucun bouton, en mode calme pour ne pas perturber l'artiste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Sora:wght@700;800&display=swap">
<style>
:root{
  --stage:#0A1630; --tile:#13244A; --panel:#0C1A3A; --panel-2:#16274E;
  --ivory:#F4EFE3; --muted:#9AA3B8; --muted-2:#66708A;
  --line:rgba(255,255,255,.09); --gold:#E6C76A; --gold-2:#C6A75E; --gold-soft:rgba(230,199,106,.14);
  --live:#FF4D5E; --rose:#F0679B;
  --sans:"Inter",system-ui,sans-serif; --display:"Sora",var(--sans);
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ivory);font-family:var(--sans);overflow:hidden;font-size:16px;-webkit-font-smoothing:antialiased}
svg{display:block}
.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── shell : mur + rail droit, aucun contrôle ── */
.stage{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto 1fr;height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--line)}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;
  background:linear-gradient(180deg,#F6E4A6,#C6A75E);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:9px;letter-spacing:.42em;color:var(--gold-2);margin-top:4px;font-weight:600}
.livepill{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:18px}
.livepill b{font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.livepill .dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:breathe 3.2s ease-in-out infinite}
.livepill .n{color:var(--muted);font-weight:600}
@keyframes breathe{50%{opacity:.45}}
/* compte à rebours de fin de live : discret, doré sous 10 min, rouge sous 2 min */
.top__r{display:flex;align-items:center;gap:14px}
.clock{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);transition:border-color .6s}
.clock__l{color:var(--muted);font-weight:600;font-size:15px}
.clock b{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.warn{border-color:rgba(230,199,106,.5)}.clock.warn b{color:var(--gold)}
.clock.last{border-color:rgba(255,77,94,.6)}.clock.last b{color:var(--live);animation:breathe 1.2s ease-in-out infinite}
.clock.over b{color:var(--live)}
.clock[hidden]{display:none}

/* ── mur de fans ── */
.wall{padding:18px 20px 22px 26px;min-height:0}
.grid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:14px}
.tile{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);min-height:0;background:var(--tile);isolation:isolate;
  transition:border-color .8s var(--ease),box-shadow .8s var(--ease)}
.tile__cam{position:absolute;inset:0;z-index:-1}
.tile__cam::after{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 70% at 50% 30%,rgba(255,255,255,.10),transparent 70%),linear-gradient(180deg,transparent 42%,rgba(8,18,42,.86))}
.tile video.camv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;background:#000}
.tile.free{opacity:.35}
/* ── DIRECT : flux de l'artiste en grand, fans sur scène à droite, aucune case vide ── */
.grid.live{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.grid.live.withfans{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}
.grid.live.withfans.many{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.fanstrip{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:14px;min-height:0}
.many .fanstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile.main{background:#0B1734}
.tile.main video.camv{object-fit:contain}
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--muted)}
.wait b{font-family:var(--display);font-size:30px;color:var(--ivory);font-weight:700}
.wait small{font-size:14px;color:var(--muted-2);max-width:520px}
.wait .pulse{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px var(--gold);animation:breathe 3.2s ease-in-out infinite}
.calm{color:var(--muted);font-size:15px;font-weight:600;line-height:1.4;padding:6px 2px}
.tile__mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:72px;color:rgba(255,255,255,.13);z-index:-1}
.tile.speaking{border-color:rgba(230,199,106,.7);box-shadow:0 0 0 1px rgba(230,199,106,.45),0 0 30px -6px rgba(230,199,106,.5)}
.name{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;
  background:rgba(10,20,44,.7);backdrop-filter:blur(6px);border:1px solid var(--line);font-weight:700;font-size:17px}
.name .m{width:17px;height:17px;color:var(--gold)}.name .m.off{color:var(--live)}
.badge{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:7px;max-width:calc(100% - 24px);
  padding:7px 14px;border-radius:999px;white-space:nowrap;background:linear-gradient(180deg,#F6E4A6,#D8B45A);color:#2A2008;
  font-weight:800;font-size:12px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 5px 16px -5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.badge span{font-size:14px}

/* ── rail droit : objectif + top fans + notables (permanents) ── */
.rail{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:18px;padding:18px 20px;min-height:0;overflow:hidden}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
/* objectif collectif */
.goal h3{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15;margin-bottom:12px}
.goal .num{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.goal .num b{font-family:var(--display);font-size:38px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.goal .num span{color:var(--muted);font-weight:600;font-size:16px}
.gauge{height:14px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold-2),var(--gold));transition:width 1.4s var(--ease)}
/* top fans permanent */
.fans{flex:none}
.fan{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);transition:transform .9s var(--ease)}
.fan:last-child{border-bottom:0}
.fan .rk{width:26px;font-family:var(--display);font-weight:800;color:var(--muted-2);text-align:center;font-size:18px}
.fan.top1 .rk,.fan.top2 .rk,.fan.top3 .rk{color:var(--gold)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0A1120}
.fan .nm{font-weight:700;flex:1;font-size:17px}
.fan .amt{color:var(--gold);font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{width:15px;height:15px;border-radius:50%;background:linear-gradient(180deg,#F6E4A6,#C6A75E)}
/* notables : peu, gros, calmes */
.notables{flex:1;min-height:0;display:flex;flex-direction:column}
.notes{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.note{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  animation:noteIn 1.1s var(--ease)}
.note.gift{background:var(--gold-soft);border-color:rgba(230,199,106,.3)}
.note .who{font-weight:800;color:var(--gold);font-size:17px}
.note .txt{font-size:18px;line-height:1.3}
.note.gift .txt{font-weight:700}
@keyframes noteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── CADEAU HÉROS : grand, doux, bref ── */
.hero{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;opacity:0;transition:opacity .7s var(--ease)}
.hero.on{opacity:1}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,rgba(230,199,106,.16),transparent 70%)}
.hero__card{position:relative;text-align:center;padding:44px 64px;border-radius:32px;background:rgba(12,26,58,.86);backdrop-filter:blur(10px);
  border:1px solid rgba(230,199,106,.45);box-shadow:0 40px 120px -30px rgba(0,0,0,.8),0 0 80px -20px rgba(230,199,106,.45);
  transform:scale(.9);transition:transform .9s var(--ease)}
.hero.on .hero__card{transform:scale(1)}
.hero__gift{font-size:96px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 10px 24px rgba(240,103,155,.5))}
.hero__what{font-family:var(--display);font-weight:800;font-size:40px;color:var(--gold);margin-bottom:10px}
.hero__from{font-size:20px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.hero__name{font-family:var(--display);font-weight:800;font-size:64px;line-height:1.05;margin-top:4px}
/* quand une animation vidéo joue, la carte descend pour la laisser respirer */
.hero.with-anim .hero__card{transform:translateY(30vh) scale(.78)}
.hero.with-anim::before{background:none}

/* ── ANIMATION DU TIP : calque vidéo 3 s (assets/tips/*.mp4) ── */
.anim{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none;opacity:0;
  transition:opacity .5s var(--ease);background:rgba(10,22,48,.6)}
.anim.on{opacity:1}
.anim video{position:relative;z-index:1;height:100vh;max-width:100vw;object-fit:contain;filter:drop-shadow(0 0 70px rgba(230,199,106,.28))}
/* visuel du tip : affiché tout de suite (le temps que la vidéo charge) et en repli si la vidéo est absente */
.anim img{position:absolute;left:50%;top:50%;height:100vh;max-width:100vw;object-fit:contain;
  transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 70px rgba(230,199,106,.28));animation:kenburns 3.2s var(--ease) forwards}
@keyframes kenburns{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.08)}}

/* ── QUESTION À RÉPONDRE : bandeau bas (lower third), calme, une seule à la fois ── */
.qa{position:fixed;left:26px;right:426px;bottom:26px;z-index:40;display:flex;align-items:center;gap:20px;padding:18px 24px;border-radius:20px;
  background:rgba(12,26,58,.93);backdrop-filter:blur(8px);border:1px solid rgba(230,199,106,.45);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.85),0 0 60px -24px rgba(230,199,106,.4);
  transform:translateY(30px);opacity:0;transition:transform .8s var(--ease),opacity .8s var(--ease);pointer-events:none}
.qa.on{transform:none;opacity:1}
.qa__k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:6px}
.qa__t{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.2;text-wrap:balance}
.qa__m{color:var(--muted);font-size:15px;font-weight:600;margin-top:5px}
.qa__likes{margin-left:auto;flex:none;text-align:center;line-height:1}
.qa__likes b{display:block;font-family:var(--display);font-size:36px;color:var(--gold);font-variant-numeric:tabular-nums}
.qa__likes span{font-size:14px;color:var(--muted);font-weight:700}
@media(max-width:1100px){.qa{right:366px}}

/* ── cœurs : rares et lents ── */
.hearts{position:fixed;right:420px;bottom:40px;width:120px;height:55%;pointer-events:none;z-index:5}
.fx{position:absolute;bottom:0;font-size:22px;opacity:0;animation:rise linear forwards;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
@keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.9}100%{transform:translateY(-50vh) translateX(var(--dx,0)) scale(1);opacity:0}}

.hint{position:fixed;left:26px;bottom:14px;font-size:11px;color:var(--muted-2);letter-spacing:.06em}
@media(max-width:1100px){.stage{grid-template-columns:1fr 340px}.hearts{right:360px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── petits écrans : le rail passe sous le mur ── */
@media(max-width:900px){
  body{overflow:auto}
  .stage{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto;min-height:100dvh}
  .top{padding:10px 14px}.logo b{font-size:20px}.livepill{font-size:14px;padding:8px 12px}.livepill b{font-size:16px}
  .clock{padding:8px 12px}.clock b{font-size:16px}.clock__l{font-size:12px}
  .wall{padding:10px 12px}.grid{height:auto;grid-template-rows:none;gap:8px}.tile{aspect-ratio:1/1;border-radius:12px}
  .grid.live{display:flex;flex-direction:column}.tile.main{aspect-ratio:16/10}
  .fanstrip,.many .fanstrip{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;gap:8px}
  .wait b{font-size:18px}
  .tile__mono{font-size:34px}.name{font-size:12px;padding:5px 9px 5px 7px;left:8px;bottom:8px}.name .m{width:12px;height:12px}
  .badge{padding:4px 8px;font-size:8.5px;top:8px;right:8px}
  .rail{border-left:0;border-top:1px solid var(--line);padding:12px 14px;gap:12px;overflow:visible}
  .qa{left:12px;right:12px;bottom:12px;padding:12px 14px;gap:12px}.qa__t{font-size:17px}.qa__likes b{font-size:24px}
  .hero__card{padding:22px 26px;border-radius:22px}.hero__gift{font-size:56px}.hero__what{font-size:24px}.hero__name{font-size:32px}.hero__from{font-size:14px}
  .hero.with-anim .hero__card{transform:translateY(24vh) scale(.8)}
  .hearts{right:20px;width:60px}
}
</style>

<div class="stage">
  <header class="top">
    <div class="logo"><b>VybzzZ</b><span>LIVE BEGINS HERE</span></div>
    <div class="top__r">
      <div class="clock" id="clock" hidden><span class="clock__l">⏱ Fin du live dans</span><b id="clockT">45:00</b></div>
      <div class="livepill"><b id="count">245</b><span class="dot"></span><span class="n">en direct</span></div>
    </div>
  </header>

  <section class="wall"><div class="grid" id="grid"></div></section>

  <aside class="rail">
    <div class="card goal" id="goalCard">
      <div class="eyebrow">Objectif du public</div>
      <h3 id="goalTitle">100 roses = un rappel 🌹</h3>
      <div class="num"><b id="goalNow">64</b><span>/ <span id="goalMax">100</span> roses</span></div>
      <div class="gauge"><i id="gauge"></i></div>
    </div>
    <div class="card fans">
      <div class="eyebrow">Top fans · en direct</div>
      <div id="fans"></div>
    </div>
    <div class="card notables">
      <div class="eyebrow">Moments</div>
      <div class="notes" id="notes"></div>
    </div>
  </aside>
</div>

<div class="anim" id="anim"><img id="animP" alt=""><video id="animV" muted playsinline preload="auto"></video></div>
<div class="hero" id="hero"><div class="hero__card">
  <div class="hero__gift" id="hGift"></div>
  <div class="hero__what" id="hWhat"></div>
  <div class="hero__from">envoyé par</div>
  <div class="hero__name" id="hName"></div>
</div></div>
<div class="qa" id="qa" role="status" aria-live="polite">
  <div><div class="qa__k" id="qaK">❓ Question du public · à répondre</div><div class="qa__t" id="qaT"></div><div class="qa__m" id="qaM"></div></div>
  <div class="qa__likes"><b id="qaL">0</b><span>❤️ likes</span></div>
</div>
<div class="hearts" id="hearts"></div>
<div class="hint">Écran projeté · aucune interaction · touche G = simuler un cadeau</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-mic"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
<g id="i-mic-off"><path d="M9 9v2a3 3 0 0 0 4.5 2.6M15 10V6a3 3 0 0 0-5.6-1.5"/><path d="M5 11a7 7 0 0 0 11 5.3M12 18v3"/><path d="M4 4l16 16"/></g>
</defs></svg>
<script>
// ── MODE DIRECT : stage.html?event=<id du concert>&key=<clé API>[&api=https://api.vybzzz.online/api]
// Le backend pousse en SSE chaque cadeau / billet CONFIRMÉ (inscrit en base) ; sans
// paramètres, la page reste en démo (cadeaux simulés toutes les 16 s, touche G).
// RÈGLE DIRECT : AUCUN faux fan — les listes de démo sont vides et toutes les
// minuteries de simulation (cadeaux, cœurs, compteur, « qui parle ») ne tournent que si !LIVE.
var Q=new URLSearchParams(location.search), LIVE=!!(Q.get('event')&&Q.get('key'));
var API=(Q.get('api')||'https://api.vybzzz.online/api').replace(/\/$/,'');
var GUESTS=LIVE?[]:[
 {n:'Kay West',mic:1,badge:{t:'Top Supporter',e:'👑'},hue:24}, // un seul micro ouvert à la fois
 {n:'Nesly',mic:0,badge:{t:'Invitée spéciale',e:'⭐'},hue:300},
 {n:'DJ Glad',mic:0,badge:{t:'Meilleur Tippeur',e:'💸'},hue:266},
 {n:'Maya',mic:0,hue:288},{n:'Sabrina',mic:0,hue:210},{n:'Ruddy',mic:0,hue:150},
 {n:'Léa',mic:0,hue:330},{n:'Tom_973',mic:0,hue:40},{n:'Jordan',mic:0,hue:190},
];
var AV=['#F0679B','#E6C76A','#7EA6FF','#63D6A6','#C58BFF','#FF9F6B','#63C6D6','#F58BB0','#9DD16B'];
function ini(n){return String(n||'').replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,1).toUpperCase();}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

// mur (démo : 9 faux fans ; direct : voir renderWallLive plus bas)
var grid=document.getElementById('grid');
GUESTS.forEach(function(g){
  var t=document.createElement('div');t.className='tile'+(g.mic?' speaking':'');
  t.innerHTML='<div class="tile__cam" style="background:linear-gradient(150deg,hsl('+g.hue+' 42% 26%),hsl('+((g.hue+40)%360)+' 38% 12%))"></div>'+
   '<div class="tile__mono">'+ini(g.n)+'</div>'+
   (g.badge?'<div class="badge"><span>'+g.badge.e+'</span>'+g.badge.t+'</div>':'')+
   '<div class="name"><svg class="m'+(g.mic?'':' off')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#'+(g.mic?'i-mic':'i-mic-off')+'"/></svg>'+g.n+'</div>';
  grid.appendChild(t);
});
// "qui parle" : lent, discret (démo)
if(!LIVE)setInterval(function(){[].forEach.call(document.querySelectorAll('.tile'),function(t,i){if(GUESTS[i]&&GUESTS[i].mic&&Math.random()<.35)t.classList.toggle('speaking');});},2600);

// top fans permanent — direct : GET /live/:event/top-fans (points de cadeaux confirmés)
var FANS=LIVE?[]:[['Lyna_973',2410],['DJ Glad',1980],['Kevin',1220],['Mimi_off',960],['Tifany',740]];
function renderFans(){
  FANS.sort(function(a,b){return b[1]-a[1];});
  var el=document.getElementById('fans');el.innerHTML='';
  if(!FANS.length){el.innerHTML='<div class="calm">Le classement s\'affichera avec les premiers cadeaux.</div>';return;}
  FANS.slice(0,5).forEach(function(f,i){
    var d=document.createElement('div');d.className='fan'+(i<3?' top'+(i+1):'');
    d.innerHTML='<span class="rk">'+(i+1)+'</span><span class="av" style="background:'+AV[i%AV.length]+'">'+esc(ini(f[0]))+'</span>'+
     '<span class="nm">'+esc(f[0])+'</span><span class="amt"><span class="coin"></span>'+(+f[1]||0).toLocaleString('fr-FR')+'</span>';
    el.appendChild(d);
  });
}
renderFans();

// objectif — direct : masqué tant que la régie n'a pas fixé d'objectif (événement SSE 'goal')

var PRO={on:false,playback:null,video:null,hls:null,state:'wait',msg:'',timer:null};

  fetch(proUrl(),{cache:'no-store'}).then(function(r){

    if(!r.ok)return proWait('Flux vidéo momentanément indisponible.');
    proAttach();
  }).catch(function(){proWait('Flux vidéo momentanément indisponible.');});}
function proPlaying(){if(PRO.state==='play')return;PRO.state='play';PRO.msg='';renderWallLive();}

  var v=PRO.video;if(!v){v=document.createElement('video');v.className='camv';v.autoplay=true;v.playsInline=true;v.muted=true;PRO.video=v;
    v.addEventListener('playing',proPlaying);

  return t;}
function waitTile(){var t=document.createElement('div');t.className='tile main';
  t.innerHTML='<div class="wait"><span class="pulse"></span><b>En attente du flux de l\'artiste…</b>'+(ZSTATUS?'<small>'+esc(ZSTATUS)+'</small>':'')+'</div>';return t;}
function renderWallLive(){
  if(PRO.on){grid.className='grid live';grid.innerHTML='';grid.appendChild(proTile());return;} // régie pro : une tuile, pas de fans
  var art=artistSlot(),fans=SLOTS.filter(function(s){return s!==art;}).sort(function(a,b){return (badgeFor(b.user_id)?1:0)-(badgeFor(a.user_id)?1:0);}).slice(0,8);
  grid.className='grid live'+(fans.length?' withfans':'')+(fans.length>4?' many':'');
  grid.innerHTML='';grid.appendChild(art?camTile(art,true):waitTile());
  if(fans.length){var strip=document.createElement('div');strip.className='fanstrip';fans.forEach(function(s){strip.appendChild(camTile(s,false));});grid.appendChild(strip);}
}
if(LIVE){
  var EVID=encodeURIComponent(Q.get('event')),H={'X-API-Key':Q.get('key')};
  grid.innerHTML='';renderWallLive();
  es.addEventListener('mic',function(e){var d=JSON.parse(e.data);MIC_STREAM=d.stream_id||null;renderWallLive();});
  es.addEventListener('badges',function(e){BADGES=JSON.parse(e.data);renderWallLive();});
  fetch(API+'/live/'+EVID+'/badges',{headers:H}).then(function(r){return r.json();}).then(function(j){if(j.data){BADGES=j.data;renderWallLive();}}).catch(function(){});
  fetch(API+'/live/'+EVID+'/hands',{headers:H}).then(function(r){return r.json();}).then(function(j){if(j.data&&j.data.mic){MIC_STREAM=j.data.mic.stream_id;renderWallLive();}}).catch(function(){});
  document.addEventListener('click',function(){renderWallLive();},{once:true}); // un geste débloque le son du micro ouvert
  startZego('stage');
}
</script>

</body></html>
