# VybzzZ — bloc "server" du site statique (vybzzz.online), servi depuis /opt/vybzzz/site.
# À rapprocher de la config existante : /etc/nginx/sites-available/vybzzz (ou similaire).
# Objectifs : vraie 404, redirections des anciennes pages, www -> apex, en-têtes de sécurité.

# 1) www -> apex (301)
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.vybzzz.online;
    # reprendre ici les mêmes lignes ssl_certificate / ssl_certificate_key que le bloc principal
    return 301 https://vybzzz.online$request_uri;
}

