# VybzzZ — configuration nginx du site statique (vybzzz.online), servi depuis /opt/vybzzz/site.
# À intégrer dans /etc/nginx/sites-available/vybzzz (ou le fichier équivalent).
#
# Mesuré le 18/09/2026 sur la prod, AVANT ces réglages :
#   - aucune compression sauf le HTML : 851 Ko de CSS/JS servis bruts (256 Ko une fois compressés)
#   - aucun en-tête de cache sur les images, le CSS et le JS : tout est retéléchargé à chaque visite
#   - HTTP/1.1 : 6 connexions parallèles maximum, alors que la page charge une dizaine de fichiers
# Ces trois réglages sont, de loin, le plus gros gain de performance disponible.

# ─────────────────────────────────────────────────────────────────────────────
# 1) COMPRESSION — à placer dans le bloc http (/etc/nginx/nginx.conf) ou server
# ─────────────────────────────────────────────────────────────────────────────
#    gzip on;
#    gzip_vary on;
#    gzip_comp_level 6;
#    gzip_min_length 1024;
#    gzip_proxied any;
#    gzip_types text/plain text/css text/xml application/javascript application/json
#               application/xml image/svg+xml application/manifest+json;
#
#    Vérification : curl -sI -H 'Accept-Encoding: gzip' https://vybzzz.online/styles.css | grep -i content-encoding

# ─────────────────────────────────────────────────────────────────────────────
# 2) www -> apex (301)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.vybzzz.online;
    # reprendre ici les mêmes lignes ssl_certificate / ssl_certificate_key que le bloc principal
    return 301 https://vybzzz.online$request_uri;
}

