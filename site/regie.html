<title>Régie Live VybzzZ</title>
<meta name="description" content="Écran de régie / retour scène VybzzZ — mur de fans, réactions, cadeaux, chat et top fans, à caster sur un écran pendant le concert.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap">
<style>
:root{
  --bg:#0A152B; --stage:#0A1630; --tile:#13244A; --panel:#0C1A3A; --panel-2:#16274E;
  --ivory:#F4EFE3; --muted:#8B93A7; --muted-2:#5C6577;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.06);
  --gold:#E6C76A; --gold-2:#C6A75E; --gold-soft:rgba(230,199,106,.14);
  --live:#FF4D5E; --rose:#F0679B; --heart:#F5C451;
  --sans:"Inter",system-ui,-apple-system,sans-serif; --display:"Sora",var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ivory);font-family:var(--sans);overflow:hidden;
  font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── shell ── */
.stage{display:flex;height:100vh;min-height:0}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.side{width:346px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* ── top bar ── */
.top{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.logo{display:flex;flex-direction:column;line-height:1;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;
  background:linear-gradient(180deg,#F6E4A6,#C6A75E);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:8.5px;letter-spacing:.42em;color:var(--gold-2);margin-top:3px;font-weight:600}
.gift-banner{margin:0 auto;display:flex;align-items:center;gap:12px;padding:9px 20px 9px 14px;border-radius:999px;
  background:radial-gradient(120% 180% at 0% 50%,rgba(240,103,155,.28),rgba(230,199,106,.12) 60%,transparent);
  border:1px solid rgba(240,103,155,.4);box-shadow:0 0 30px -8px rgba(240,103,155,.5);animation:giftPulse 2.4s ease-in-out infinite}
@keyframes giftPulse{50%{box-shadow:0 0 40px -6px rgba(240,103,155,.75)}}
.gift-banner .rose{font-size:26px;filter:drop-shadow(0 2px 6px rgba(240,103,155,.6))}
.gift-banner b{font-size:16px}
.gift-banner small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:blink 1.5s infinite}
.pill b{font-weight:700}.pill .n{color:var(--muted);font-weight:600}
@keyframes blink{50%{opacity:.35}}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);transition:.2s}
.icon-btn:hover{color:var(--ivory);border-color:var(--gold-soft)}

/* ── grille ── */
.grid-wrap{flex:1;min-height:0;padding:16px 18px}
.grid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}
.tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:0;
  background:var(--tile);isolation:isolate}
.tile__cam{position:absolute;inset:0;z-index:-1}
.tile__cam::after{content:"";position:absolute;inset:0;
  background:radial-gradient(90% 70% at 50% 30%,rgba(255,255,255,.10),transparent 70%),linear-gradient(180deg,transparent 40%,rgba(8,18,42,.85))}
.tile__mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:64px;color:rgba(255,255,255,.14);z-index:-1}
.tile.speaking{border-color:rgba(230,199,106,.75);box-shadow:0 0 0 1px rgba(230,199,106,.5),0 0 26px -6px rgba(230,199,106,.55)}
.name{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;
  border-radius:999px;background:rgba(10,20,44,.66);backdrop-filter:blur(6px);border:1px solid var(--line);font-weight:600;font-size:13px}
.name .m{width:16px;height:16px;color:var(--gold)}
.name .m.off{color:var(--live)}
.badge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;
  max-width:calc(100% - 20px);padding:6px 12px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(180deg,#F6E4A6,#D8B45A);color:#2A2008;font-weight:800;font-size:10.5px;letter-spacing:.03em;
  text-transform:uppercase;box-shadow:0 5px 16px -5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.badge span{font-size:12px}

/* ── barre de contrôle ── */
.controls{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-top:1px solid var(--line-2);position:relative}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 16px;border-radius:14px;color:var(--muted);
  transition:.18s;min-width:70px;position:relative}
.ctrl:hover{color:var(--ivory);background:var(--panel-2)}
.ctrl.active{color:var(--gold)}
.ctrl.off .icon{color:var(--live)}
.ctrl small{font-size:11px;font-weight:600}
.ctrl .badge-n{position:absolute;top:2px;right:14px;background:var(--gold);color:#22190A;font-size:9.5px;font-weight:800;
  padding:1px 6px;border-radius:999px}
.ctrl.tip{color:var(--rose)}
.leave{position:absolute;right:18px;display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;
  background:linear-gradient(180deg,#FF5E6E,#E23B4C);color:#fff;font-weight:700}
.status{position:absolute;left:18px;display:flex;align-items:center;gap:12px;color:var(--muted-2);font-size:11px;font-weight:600}
.status .hd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:2px;height:13px}
.bars i{width:3px;background:var(--gold);border-radius:1px}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:13px;background:var(--line)}

/* ── panneau droit ── */
.tabs{display:flex;padding:6px 8px;gap:2px;border-bottom:1px solid var(--line-2)}
.tab{flex:1;padding:12px 8px;font-weight:700;font-size:14px;color:var(--muted);border-radius:10px;position:relative}
.tab.active{color:var(--ivory)}
.tab.active::after{content:"";position:absolute;left:22%;right:22%;bottom:2px;height:2.5px;border-radius:2px;background:var(--gold)}
.panelbody{flex:1;min-height:0;display:flex;flex-direction:column}
.tabpane{display:none;flex:1;min-height:0;flex-direction:column}
.tabpane.on{display:flex}

/* chat */
.chat{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:13px;scrollbar-width:thin}
.chat::-webkit-scrollbar{width:6px}.chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.msg{display:flex;gap:10px;align-items:flex-start}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0A1120}
.msg .body{min-width:0}
.msg .head{display:flex;align-items:baseline;gap:8px}
.msg .who{font-weight:700;font-size:13px;color:var(--gold)}
.msg .time{font-size:10.5px;color:var(--muted-2);font-weight:600}
.msg .txt{color:#DCE0EA;font-size:13.5px;margin-top:1px;word-break:break-word}
.msg.gift{background:var(--gold-soft);border:1px solid rgba(230,199,106,.28);border-radius:12px;padding:9px 11px;margin:-2px -2px}
.msg.gift .txt{color:var(--gold);font-weight:600}
.raise{margin:0 14px 12px;padding:11px 12px;border-radius:14px;background:rgba(230,199,106,.08);border:1px solid rgba(230,199,106,.35);
  display:flex;align-items:center;gap:11px}
.raise .h{font-size:20px}
.raise b{font-weight:700}.raise small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.raise .see{margin-left:auto;padding:8px 16px;border-radius:9px;background:var(--gold);color:#22190A;font-weight:700;font-size:13px}
.composer{display:flex;align-items:center;gap:9px;padding:12px 14px;border-top:1px solid var(--line-2)}
.composer input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ivory);font-size:13.5px}
.composer input::placeholder{color:var(--muted-2)}
.composer input:focus{outline:none;border-color:var(--gold-soft)}
.send{width:42px;height:42px;flex:none;border-radius:50%;background:var(--gold);color:#22190A;display:grid;place-items:center}
.compbtn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

/* top fans */
.fan{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-2)}
.fan .rk{width:24px;font-family:var(--display);font-weight:800;color:var(--muted-2);text-align:center;font-size:15px}
.fan.top1 .rk,.fan.top2 .rk,.fan.top3 .rk{color:var(--gold)}
.fan .nm{font-weight:600;flex:1}
.fan .amt{color:var(--gold);font-weight:700;display:flex;align-items:center;gap:5px}
.coin{width:15px;height:15px;border-radius:50%;background:linear-gradient(180deg,#F6E4A6,#C6A75E)}
/* missions */
.mission{padding:14px 4px;border-bottom:1px solid var(--line-2)}
.mission .row{display:flex;align-items:center;gap:10px}
.mission .emo{font-size:20px}
.mission b{flex:1;font-weight:600}
.mission .rw{color:var(--gold);font-weight:700;font-size:12.5px}
.bar{height:7px;border-radius:9px;background:var(--panel-2);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:9px}

/* cœurs flottants */
.hearts{position:absolute;right:352px;bottom:80px;width:80px;height:60%;pointer-events:none;z-index:5;overflow:visible}
.fx{position:absolute;bottom:0;font-size:24px;animation:rise linear forwards;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(-46vh) translateX(var(--dx,0)) scale(1.1);opacity:0}}

.proto{position:absolute;top:12px;right:360px;z-index:9;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold-2);background:rgba(230,199,106,.1);border:1px solid var(--gold-soft);border-radius:999px;padding:4px 10px}

@media(max-width:1100px){.side{width:300px}.hearts,.proto{right:306px}}
@media(max-width:820px){
  .stage{flex-direction:column;height:auto;min-height:100vh}
  .side{width:100%;border-left:0;border-top:1px solid var(--line);height:60vh}
  .grid-wrap{height:56vh}.gift-banner small{display:none}.hearts,.proto{display:none}
  .ctrl small{display:none}.ctrl{min-width:0;padding:10px}.leave,.status{position:static}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<script>
// ── Données (exemples plausibles — prototype) ──
var GUESTS=[
 {n:'Kay West',mic:1,badge:{t:'Top Supporter',e:'👑'},hue:24},
 {n:'Nesly',mic:1,badge:{t:'Invitée spéciale',e:'⭐'},hue:300},
 {n:'DJ Glad',mic:1,badge:{t:'Meilleur Tippeur',e:'💸',right:1},hue:266},
 {n:'Maya',mic:1,hue:288},
 {n:'Sabrina',mic:0,hue:210},
 {n:'Ruddy',mic:1,hue:150},
 {n:'Léa',mic:0,hue:330},
 {n:'Tom_973',mic:0,hue:40},
 {n:'Jordan',mic:0,hue:190},
];
var AV=['#F0679B','#E6C76A','#7EA6FF','#63D6A6','#C58BFF','#FF9F6B','#63C6D6','#F58BB0','#9DD16B'];
function initial(n){return n.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,1).toUpperCase();}

// Grille
var grid=document.getElementById('grid');
GUESTS.forEach(function(g,i){
  var t=document.createElement('div');t.className='tile'+(g.mic?' speaking':'');
  var cam='linear-gradient(150deg,hsl('+g.hue+' 42% 26%),hsl('+((g.hue+40)%360)+' 38% 12%))';
  t.innerHTML=
    '<div class="tile__cam" style="background:'+cam+'"></div>'+
    '<div class="tile__mono">'+initial(g.n)+'</div>'+
    (g.badge?'<div class="badge"><span>'+g.badge.e+'</span>'+g.badge.t+'</div>':'')+
    '<div class="name"><svg class="m'+(g.mic?'':' off')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#'+(g.mic?'i-mic':'i-mic-off')+'"/></svg>'+g.n+'</div>';
  grid.appendChild(t);
});
// petit "qui parle" animé
setInterval(function(){
  var tiles=[].slice.call(document.querySelectorAll('.tile'));
  tiles.forEach(function(t,i){ if(GUESTS[i].mic && Math.random()<.5) t.classList.toggle('speaking'); });
},1400);

// Chat
var MSGS=[
 {w:'Lyna_973',t:'Rose ×20 🌹',time:'20:14',gift:1,c:0},
 {w:'Kevin',t:'Quel son ! 🔥',time:'20:14',c:2},
 {w:'Mimi_off',t:'Incroyable ! ❤️',time:'20:14',c:7},
 {w:'Tifany',t:'Vous êtes au top 🙌',time:'20:15',c:4},
 {w:'Lucas973',t:'Respect 👏',time:'20:15',c:6},
 {w:'SarahK',t:'On veut la suite ! 🎶',time:'20:15',c:1},
 {w:'Maya_Fan',t:'❤️❤️❤️',time:'20:15',c:3},
 {w:'Chris',t:'Big up !',time:'20:15',c:5},
 {w:'Jules',t:'🔥🔥🔥',time:'20:15',c:8},
];
var chat=document.getElementById('chat');
function addMsg(m){
  var el=document.createElement('div');el.className='msg'+(m.gift?' gift':'');
  el.innerHTML='<div class="av" style="background:'+AV[m.c%AV.length]+'">'+initial(m.w)+'</div>'+
   '<div class="body"><div class="head"><span class="who">'+m.w+'</span><span class="time">'+(m.time||now())+'</span></div>'+
   '<div class="txt">'+m.t+'</div></div>';
  chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
}
function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
MSGS.forEach(addMsg);

// messages entrants (feel live)
var INCOMING=[{w:'Océane',t:'🔥 énorme',c:1},{w:'Brayan',t:'Guadeloupe présente 🇬🇵',c:4},{w:'Naïma',t:'j\'achète le ticket',c:7},{w:'Steeve',t:'la voix 😍',c:2},{w:'Wendy',t:'❤️',c:3}];
var ii=0;setInterval(function(){ if(document.querySelector('[data-pane=chat]').classList.contains('on')){addMsg(INCOMING[ii%INCOMING.length]);ii++;} },4200);

// Top fans
var FANS=[['Lyna_973',2410],['DJ Glad',1980],['Kevin',1220],['Mimi_off',960],['Tifany',740],['SarahK',520],['Brayan',410],['Naïma',300]];
var fansEl=document.getElementById('fans');
FANS.forEach(function(f,i){
  var d=document.createElement('div');d.className='fan'+(i<3?' top'+(i+1):'');
  d.innerHTML='<span class="rk">'+(i+1)+'</span><span class="av" style="width:30px;height:30px;background:'+AV[i%AV.length]+'">'+initial(f[0])+'</span>'+
   '<span class="nm">'+f[0]+'</span><span class="amt"><span class="coin"></span>'+f[1].toLocaleString('fr-FR')+'</span>';
  fansEl.appendChild(d);
});
// Missions
var MISS=[['🎁','Envoie 5 cœurs','+10 pts',80],['🎟️','Achète ton ticket','+50 pts',0],['⏱️','Reste 10 min dans le live','+15 pts',60],['🤝','Invite un ami','+30 pts',33]];
var missEl=document.getElementById('missions');
MISS.forEach(function(m){
  var d=document.createElement('div');d.className='mission';
  d.innerHTML='<div class="row"><span class="emo">'+m[0]+'</span><b>'+m[1]+'</b><span class="rw">'+m[2]+'</span></div><div class="bar"><i style="width:'+m[3]+'%"></i></div>';
  missEl.appendChild(d);
});

// Onglets
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});t.classList.add('active');
  document.querySelectorAll('.tabpane').forEach(function(p){p.classList.toggle('on',p.dataset.pane===t.dataset.tab);});
};});

// Contrôles toggle
document.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){
  b.classList.toggle('active');b.classList.toggle('off');
  if(b.dataset.toggle==='mic'){var u=b.querySelector('use');u.setAttribute('href',b.classList.contains('off')?'#i-mic-off':'#i-mic');}
};});

// Cœurs
var hearts=document.getElementById('hearts');var EMO=['❤️','🧡','💛','🔥','👏'];
function heart(){var s=document.createElement('span');s.className='fx';s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
  s.style.right=(Math.random()*50)+'px';s.style.fontSize=(20+Math.random()*16)+'px';
  s.style.setProperty('--dx',((Math.random()*60-30)|0)+'px');var d=3.2+Math.random()*1.8;s.style.animationDuration=d+'s';
  hearts.appendChild(s);setTimeout(function(){s.remove();},d*1000+100);}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){setInterval(heart,600);heart();}
document.getElementById('react').onclick=function(){for(var k=0;k<6;k++)setTimeout(heart,k*90);};

// Envoyer un message
function send(){var i=document.getElementById('msgInput');if(!i.value.trim())return;addMsg({w:'Toi',t:i.value.trim(),c:1});i.value='';}
document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
document.getElementById('tip').onclick=function(){for(var k=0;k<8;k++)setTimeout(heart,k*70);addMsg({w:'Toi',t:'Rose ×5 🌹',gift:1,c:1});};
document.querySelector('.see').onclick=function(){this.textContent='Ajouté ✓';this.style.background='#63D6A6';};
</script>
