<title>Console Régie VybzzZ</title>
<meta name="description" content="Console opérateur de régie VybzzZ : mur de fans avec contrôles (micro, retirer), file « lever la main » (donner / refuser le micro), chat, top fans, missions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap">
<style>
:root{
  --stage:#0A1630; --tile:#13244A; --panel:#0C1A3A; --panel-2:#16274E;
  --ivory:#F4EFE3; --muted:#8B93A7; --muted-2:#5C6577;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.06);
  --gold:#E6C76A; --gold-2:#C6A75E; --gold-soft:rgba(230,199,106,.14);
  --live:#FF4D5E; --rose:#F0679B; --ok:#63D6A6;
  --sans:"Inter",system-ui,sans-serif; --display:"Sora",var(--sans); --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ivory);font-family:var(--sans);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

.stage{display:flex;height:100vh;min-height:0}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.side{width:346px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* top */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.logo{display:flex;flex-direction:column;line-height:1;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;
  background:linear-gradient(180deg,#F6E4A6,#C6A75E);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:8.5px;letter-spacing:.42em;color:var(--gold-2);margin-top:3px;font-weight:600}
.role{flex:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);
  background:rgba(230,199,106,.1);border:1px solid var(--gold-soft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.gift-banner{margin:0 auto;display:flex;align-items:center;gap:12px;padding:9px 20px 9px 14px;border-radius:999px;
  background:radial-gradient(120% 180% at 0% 50%,rgba(240,103,155,.28),rgba(230,199,106,.12) 60%,transparent);
  border:1px solid rgba(240,103,155,.4);box-shadow:0 0 30px -8px rgba(240,103,155,.5)}
.gift-banner .rose{font-size:26px}.gift-banner b{font-size:16px}.gift-banner small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:blink 1.5s infinite}
.pill b{font-weight:700}.pill .n{color:var(--muted);font-weight:600}
@keyframes blink{50%{opacity:.35}}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

/* grille */
.grid-wrap{flex:1;min-height:0;padding:16px 18px}
.grid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}
.tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:0;background:var(--tile);isolation:isolate;transition:border-color .4s,box-shadow .4s}
.tile__cam{position:absolute;inset:0;z-index:-1}
.tile__cam::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 30%,rgba(255,255,255,.10),transparent 70%),linear-gradient(180deg,transparent 40%,rgba(8,18,42,.85))}
.tile__mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:64px;color:rgba(255,255,255,.14);z-index:-1}
.tile.speaking{border-color:rgba(230,199,106,.75);box-shadow:0 0 0 1px rgba(230,199,106,.5),0 0 26px -6px rgba(230,199,106,.55)}
.tile.onair{border-color:rgba(99,214,166,.8);box-shadow:0 0 0 1px rgba(99,214,166,.5),0 0 26px -6px rgba(99,214,166,.55)}
.name{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:999px;
  background:rgba(10,20,44,.66);backdrop-filter:blur(6px);border:1px solid var(--line);font-weight:600;font-size:13px}
.name .m{width:16px;height:16px;color:var(--gold)}.name .m.off{color:var(--live)}
.badge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 20px);
  padding:6px 12px;border-radius:999px;white-space:nowrap;background:linear-gradient(180deg,#F6E4A6,#D8B45A);color:#2A2008;
  font-weight:800;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 5px 16px -5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.badge.air{background:linear-gradient(180deg,#8FF0C4,#4FC993);color:#062A18}
.badge span{font-size:12px}
/* contrôles opérateur sur chaque vignette (au survol) */
.ops{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:6px;opacity:0;transform:translateY(4px);transition:.2s}
.tile:hover .ops{opacity:1;transform:none}
.op{width:34px;height:34px;border-radius:50%;background:rgba(10,20,44,.85);border:1px solid var(--line);display:grid;place-items:center;color:var(--ivory)}
.op:hover{border-color:var(--gold)}.op.danger:hover{border-color:var(--live);color:var(--live)}
.op .icon{width:17px;height:17px}

/* barre opérateur */
.controls{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-top:1px solid var(--line-2);position:relative}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 16px;border-radius:14px;color:var(--muted);transition:.18s;min-width:74px;position:relative}
.ctrl:hover{color:var(--ivory);background:var(--panel-2)}
.ctrl small{font-size:11px;font-weight:600;white-space:nowrap}
.ctrl .badge-n{position:absolute;top:2px;right:12px;background:var(--gold);color:#22190A;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:999px}
.leave{position:absolute;right:18px;display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;background:linear-gradient(180deg,#FF5E6E,#E23B4C);color:#fff;font-weight:700}
.status{position:absolute;left:18px;display:flex;align-items:center;gap:12px;color:var(--muted-2);font-size:11px;font-weight:600}
.status .hd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* panneau droit */
.tabs{display:flex;padding:6px 8px;gap:2px;border-bottom:1px solid var(--line-2)}
.tab{flex:1;padding:12px 4px;font-weight:700;font-size:13px;color:var(--muted);border-radius:10px;position:relative}
.tab.active{color:var(--ivory)}
.tab.active::after{content:"";position:absolute;left:20%;right:20%;bottom:2px;height:2.5px;border-radius:2px;background:var(--gold)}
.tab .q{display:inline-block;margin-left:5px;background:var(--gold);color:#22190A;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;vertical-align:1px}
.panelbody{flex:1;min-height:0;display:flex;flex-direction:column}
.tabpane{display:none;flex:1;min-height:0;flex-direction:column}
.tabpane.on{display:flex}
.chat{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:13px;scrollbar-width:thin}
.msg{display:flex;gap:10px;align-items:flex-start}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0A1120}
.msg .head{display:flex;align-items:baseline;gap:8px}.msg .who{font-weight:700;font-size:13px;color:var(--gold)}
.msg .time{font-size:10.5px;color:var(--muted-2);font-weight:600}.msg .txt{color:#DCE0EA;font-size:13.5px;margin-top:1px}
.msg.gift{background:var(--gold-soft);border:1px solid rgba(230,199,106,.28);border-radius:12px;padding:9px 11px;margin:-2px -2px}
.msg.gift .txt{color:var(--gold);font-weight:600}
.raise{margin:0 14px 12px;padding:11px 12px;border-radius:14px;background:rgba(230,199,106,.08);border:1px solid rgba(230,199,106,.35);display:flex;align-items:center;gap:11px}
.raise .h{font-size:20px}.raise b{font-weight:700}.raise small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.raise .see{margin-left:auto;padding:8px 14px;border-radius:9px;background:var(--gold);color:#22190A;font-weight:700;font-size:13px;white-space:nowrap}
.composer{display:flex;align-items:center;gap:9px;padding:12px 14px;border-top:1px solid var(--line-2)}
.composer input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ivory);font-size:13.5px}
.composer input:focus{outline:none;border-color:var(--gold-soft)}
.send{width:42px;height:42px;flex:none;border-radius:50%;background:var(--gold);color:#22190A;display:grid;place-items:center}
/* file d'attente */
.queue{padding:10px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.req{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.req b{font-weight:700}.req small{display:block;color:var(--muted);font-size:11.5px}
.req .acts{margin-left:auto;display:flex;gap:6px}
.give{padding:8px 12px;border-radius:9px;background:var(--ok);color:#062A18;font-weight:700;font-size:12.5px;white-space:nowrap}
.deny{padding:8px 10px;border-radius:9px;background:rgba(255,77,94,.15);color:#FF8A96;font-weight:700;font-size:12.5px;border:1px solid rgba(255,77,94,.3)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* fans / missions */
.fan{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-2)}
.fan .rk{width:24px;font-family:var(--display);font-weight:800;color:var(--muted-2);text-align:center;font-size:15px}
.fan.top1 .rk,.fan.top2 .rk,.fan.top3 .rk{color:var(--gold)}
.fan .nm{font-weight:600;flex:1}.fan .amt{color:var(--gold);font-weight:700;display:flex;align-items:center;gap:5px}
.coin{width:15px;height:15px;border-radius:50%;background:linear-gradient(180deg,#F6E4A6,#C6A75E)}
.mission{padding:14px 4px;border-bottom:1px solid var(--line-2)}
.mission .row{display:flex;align-items:center;gap:10px}.mission .emo{font-size:20px}.mission b{flex:1;font-weight:600}.mission .rw{color:var(--gold);font-weight:700;font-size:12.5px}
.bar{height:7px;border-radius:9px;background:var(--panel-2);margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);z-index:60;padding:11px 18px;border-radius:12px;
  background:rgba(12,26,58,.95);border:1px solid var(--line);font-weight:600;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hearts{position:absolute;right:352px;bottom:80px;width:80px;height:60%;pointer-events:none;z-index:5}
.fx{position:absolute;bottom:0;font-size:24px;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(-46vh) translateX(var(--dx,0)) scale(1.1);opacity:0}}
@media(max-width:1100px){.side{width:300px}.hearts{right:306px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

    <header class="top">
      <div class="logo"><b>VYBZZZ</b><span>LIVE BEGINS HERE</span></div>

      <div class="top-right">
        <div class="pill"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-users"/></svg><b>245</b><span class="dot"></span><span class="n">en direct</span></div>

      </div>

      <div class="tabpane" data-pane="missions" style="padding:8px 16px;overflow-y:auto"><div id="missions"></div></div>
    </div>

</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<g id="i-mic"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
<g id="i-mic-off"><path d="M9 9v2a3 3 0 0 0 4.5 2.6M15 10V6a3 3 0 0 0-5.6-1.5"/><path d="M5 11a7 7 0 0 0 11 5.3M12 18v3"/><path d="M4 4l16 16"/></g>
<g id="i-users"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6M15.5 13.6A5.5 5.5 0 0 1 20.5 19"/></g>
<g id="i-hand"><path d="M8 12V6a1.6 1.6 0 0 1 3.2 0v5m0-1V4.6a1.6 1.6 0 0 1 3.2 0V11m0-1.4a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1a5 5 0 0 1-4.2-2.3L4 15.5a1.7 1.7 0 0 1 2.7-2l1.3 1.5"/></g>

<script>
// ── MODE DIRECT : regie.html?event=<id du concert>&key=<clé API>[&api=https://api.vybzzz.online/api]
// Sans paramètres : démo (messages / mains simulés). En direct : chat centralisé,
// cadeaux et billets confirmés arrivent par SSE ; la régie écrit dans le vrai chat.
var Q=new URLSearchParams(location.search),LIVE=!!(Q.get('event')&&Q.get('key')),API=(Q.get('api')||'https://api.vybzzz.online/api').replace(/\/$/,'');
// RÈGLE : un seul micro ouvert à la fois sur le mur (c'est un concert). Les fans
// arrivent micro coupé ; ouvrir un micro coupe tous les autres (voir openMic).
var GUESTS=[
 {n:'Kay West',mic:0,badge:{t:'Top Supporter',e:'👑'},hue:24},
 {n:'Nesly',mic:0,badge:{t:'Invitée spéciale',e:'⭐'},hue:300},
 {n:'DJ Glad',mic:0,badge:{t:'Meilleur Tippeur',e:'💸'},hue:266},
 {n:'Maya',mic:0,hue:288},{n:'Sabrina',mic:0,hue:210},{n:'Ruddy',mic:0,hue:150},
 {n:'Léa',mic:0,hue:330},{n:'Tom_973',mic:0,hue:40},{n:'Jordan',mic:0,hue:190},
];
function muteEveryone(){GUESTS.forEach(function(g){g.mic=0;g.onair=0;});}
function openMic(i){var wasOpen=GUESTS.filter(function(g){return g.mic;}).map(function(g){return g.n;});muteEveryone();GUESTS[i].mic=1;return wasOpen;}
function updateMicStatus(){var on=GUESTS.find(function(g){return g.mic;});var el=document.getElementById('micStatus');if(el)el.innerHTML=on?'🎙️ Micro ouvert : <b style="color:var(--gold)">'+on.n+'</b>':'🔇 Aucun micro ouvert';}
var AV=['#F0679B','#E6C76A','#7EA6FF','#63D6A6','#C58BFF','#FF9F6B','#63C6D6','#F58BB0','#9DD16B'];
function ini(n){return n.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,1).toUpperCase();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}

// ── mur + contrôles opérateur ──
var grid=document.getElementById('grid');
function renderGrid(){
  grid.innerHTML='';
  GUESTS.forEach(function(g,i){
    var t=document.createElement('div');t.className='tile'+(g.onair?' onair':(g.mic?' speaking':''));
    t.innerHTML='<div class="tile__cam" style="background:linear-gradient(150deg,hsl('+g.hue+' 42% 26%),hsl('+((g.hue+40)%360)+' 38% 12%))"></div>'+
     '<div class="tile__mono">'+ini(g.n)+'</div>'+
     (g.onair?'<div class="badge air"><span>🎙️</span>À l\'antenne</div>':(g.badge?'<div class="badge"><span>'+g.badge.e+'</span>'+g.badge.t+'</div>':''))+
     '<div class="name"><svg class="m'+(g.mic?'':' off')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#'+(g.mic?'i-mic':'i-mic-off')+'"/></svg>'+g.n+'</div>'+
     '<div class="ops"><button class="op" title="'+(g.mic?'Couper le micro':'Donner le micro')+'" data-mic="'+i+'"><svg class="icon" viewBox="0 0 24 24"><use href="#'+(g.mic?'i-mic-off':'i-mic')+'"/></svg></button>'+
     '<button class="op danger" title="Retirer de l\'écran" data-rm="'+i+'"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>';
    grid.appendChild(t);
  });
  grid.querySelectorAll('[data-mic]').forEach(function(b){b.onclick=function(){var i=+b.dataset.mic,g=GUESTS[i];
    if(g.mic){g.mic=0;g.onair=0;renderGrid();toast(g.n+' : micro coupé');}
    else{var prev=openMic(i);renderGrid();toast(g.n+' : micro ouvert'+(prev.length?' — '+prev.join(', ')+' coupé':''));}};});
  grid.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){var g=GUESTS[+b.dataset.rm];GUESTS[+b.dataset.rm]={n:'Libre',mic:0,hue:220,free:1};renderGrid();toast(g.n+' retiré de l\'écran');};});
  updateMicStatus();
}
renderGrid();
document.getElementById('muteAll').onclick=function(){GUESTS.forEach(function(g){g.mic=0;g.onair=0;});renderGrid();toast('Tous les micros coupés');};

// ── file "lever la main" ──
var QUEUE=[{n:'Enzo',w:'il y a 20 s'},{n:'Naïma',w:'il y a 1 min'},{n:'Brayan',w:'il y a 2 min'}];
function renderQueue(){
  var q=document.getElementById('queue');q.innerHTML='';
  document.getElementById('qn').textContent=QUEUE.length;document.getElementById('qn2').textContent=QUEUE.length;
  var rc=document.getElementById('raiseCard');
  if(!QUEUE.length){q.innerHTML='<div class="empty">Personne n\'a levé la main.</div>';rc.hidden=true;return;}
  rc.hidden=false;document.getElementById('rName').textContent=QUEUE[0].n;
  QUEUE.forEach(function(r,i){
    var d=document.createElement('div');d.className='req';
    d.innerHTML='<span class="av" style="background:'+AV[(i+3)%AV.length]+'">'+ini(r.n)+'</span><div><b>'+r.n+'</b><small>✋ a levé la main · '+r.w+'</small></div>'+
     '<div class="acts"><button class="give" data-give="'+i+'">🎙️ Donner le micro</button><button class="deny" data-deny="'+i+'">Refuser</button></div>';
    q.appendChild(d);
  });
  q.querySelectorAll('[data-give]').forEach(function(b){b.onclick=function(){give(+b.dataset.give);};});
  q.querySelectorAll('[data-deny]').forEach(function(b){b.onclick=function(){var r=QUEUE.splice(+b.dataset.deny,1)[0];renderQueue();toast(r.n+' : demande refusée');};});
}
function give(i){
  var r=QUEUE.splice(i,1)[0];
  // slot : libre > micro coupé > dernier
  var s=GUESTS.findIndex(function(g){return g.free;});if(s<0)s=GUESTS.findIndex(function(g){return !g.mic&&!g.badge;});if(s<0)s=GUESTS.length-1;
  muteEveryone(); // un seul micro : le nouvel intervenant prend la parole, les autres sont coupés
  GUESTS[s]={n:r.n,mic:1,onair:1,hue:Math.floor(Math.random()*360)};
  renderGrid();renderQueue();toast('🎙️ '+r.n+' est à l\'antenne');
  for(var k=0;k<5;k++)setTimeout(heart,k*90);
}
renderQueue();
function showTab(id){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.tab===id);});document.querySelectorAll('.tabpane').forEach(function(p){p.classList.toggle('on',p.dataset.pane===id);});}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){showTab(t.dataset.tab);};});
document.getElementById('goQueue').onclick=function(){showTab('queue');};
document.getElementById('rSee').onclick=function(){showTab('queue');};
// nouvelles mains de temps en temps
var HANDS=['Océane','Steeve','Wendy','Lucas973'];var hi=0;
if(!LIVE)setInterval(function(){QUEUE.push({n:HANDS[hi%HANDS.length],w:'à l\'instant'});hi++;renderQueue();toast('✋ '+QUEUE[QUEUE.length-1].n+' a levé la main');},21000);

// ── chat ──
var MSGS=[{w:'Lyna_973',t:'Rose ×20 🌹',time:'20:14',gift:1,c:0},{w:'Kevin',t:'Quel son ! 🔥',time:'20:14',c:2},{w:'Mimi_off',t:'Incroyable ! ❤️',time:'20:14',c:7},
 {w:'Tifany',t:'Vous êtes au top 🙌',time:'20:15',c:4},{w:'Lucas973',t:'Respect 👏',time:'20:15',c:6},{w:'SarahK',t:'On veut la suite ! 🎶',time:'20:15',c:1},{w:'Chris',t:'Big up !',time:'20:15',c:5}];
var chat=document.getElementById('chat');
function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function addMsg(m){var el=document.createElement('div');el.className='msg'+(m.gift?' gift':'');
  el.innerHTML='<div class="av" style="background:'+AV[m.c%AV.length]+'">'+ini(m.w)+'</div><div><div class="head"><span class="who">'+m.w+'</span><span class="time">'+(m.time||now())+'</span></div><div class="txt">'+m.t+'</div></div>';
  chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
MSGS.forEach(addMsg);
var INC=[{w:'Océane',t:'🔥 énorme',c:1},{w:'Brayan',t:'Guadeloupe présente 🇬🇵',c:4},{w:'Naïma',t:'j\'achète le ticket',c:7},{w:'Steeve',t:'la voix 😍',c:2}];var ii=0;
if(!LIVE)setInterval(function(){addMsg(INC[ii%INC.length]);ii++;},4500);
function send(){var i=document.getElementById('msgInput'),t=i.value.trim();if(!t)return;i.value='';
  if(LIVE){fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/messages',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({text:t,user:'Prod VybzzZ'})})
    .then(function(r){if(!r.ok)throw 0;addMsg({w:'Prod VybzzZ',t:t,c:1});}).catch(function(){toast('Envoi impossible (clé / réseau)');});}
  else addMsg({w:'Prod VybzzZ',t:t,c:1});}
document.getElementById('sendBtn').onclick=send;document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});

// ── fans / missions ──
var FANS=[['Lyna_973',2410],['DJ Glad',1980],['Kevin',1220],['Mimi_off',960],['Tifany',740],['SarahK',520]];
var fe=document.getElementById('fans');FANS.forEach(function(f,i){var d=document.createElement('div');d.className='fan'+(i<3?' top'+(i+1):'');
  d.innerHTML='<span class="rk">'+(i+1)+'</span><span class="av" style="width:30px;height:30px;background:'+AV[i%AV.length]+'">'+ini(f[0])+'</span><span class="nm">'+f[0]+'</span><span class="amt"><span class="coin"></span>'+f[1].toLocaleString('fr-FR')+'</span>';fe.appendChild(d);});
var MISS=[['🎁','Envoie 5 cœurs','+10 pts',80],['🎟️','Achète ton ticket','+50 pts',0],['⏱️','Reste 10 min','+15 pts',60],['🤝','Invite un ami','+30 pts',33]];
var me=document.getElementById('missions');MISS.forEach(function(m){var d=document.createElement('div');d.className='mission';
  d.innerHTML='<div class="row"><span class="emo">'+m[0]+'</span><b>'+m[1]+'</b><span class="rw">'+m[2]+'</span></div><div class="bar"><i style="width:'+m[3]+'%"></i></div>';me.appendChild(d);});

// ── divers ──
document.getElementById('goalBtn').onclick=function(){toast('🌹 Objectif « 100 roses = un rappel » affiché sur le Stage');};
document.getElementById('testGift').onclick=function(){
  if(LIVE){fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/emit',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({type:'gift',gift:'Rose',user:'Prod VybzzZ (test)',points:100})})
    .then(function(r){toast(r.ok?'Cadeau test envoyé au Stage':'Échec (clé / réseau)');}).catch(function(){toast('Échec (réseau)');});}
  else{addMsg({w:'Prod VybzzZ',t:'Rose ×5 🌹 (test)',gift:1,c:1});toast('Cadeau test (démo)');}
  for(var k=0;k<8;k++)setTimeout(heart,k*70);};
var hearts=document.getElementById('hearts'),EMO=['❤️','🧡','💛','🔥','👏'];
function heart(){var s=document.createElement('span');s.className='fx';s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
  s.style.right=(Math.random()*50)+'px';s.style.fontSize=(20+Math.random()*16)+'px';s.style.setProperty('--dx',((Math.random()*60-30)|0)+'px');
  var d=3.2+Math.random()*1.8;s.style.animationDuration=d+'s';hearts.appendChild(s);setTimeout(function(){s.remove();},d*1000+100);}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){setInterval(heart,700);}

// ── Connexion DIRECT : historique du chat + flux SSE (chat, cadeaux, billets) ──
if(LIVE){
  document.querySelector('.role').textContent='Console · DIRECT · concert #'+Q.get('event');
  var H={'X-API-Key':Q.get('key')},EV=encodeURIComponent(Q.get('event'));
  fetch(API+'/live/'+EV+'/messages?limit=50',{headers:H}).then(function(r){return r.json();})
    .then(function(j){(j.data||[]).forEach(function(m){addMsg({w:m.name||'Fan',t:m.text,c:(m.name||'').length,time:(m.created_at||'').slice(11,16)});});})
    .catch(function(){toast('Historique du chat indisponible');});
  var es=new EventSource(API+'/live/'+EV+'/stream?key='+encodeURIComponent(Q.get('key')));
  es.addEventListener('chat',function(e){var d=JSON.parse(e.data);if(d.user!=='Prod VybzzZ')addMsg({w:d.user||'Fan',t:d.text,c:(d.user||'').length});});
  es.addEventListener('gift',function(e){var d=JSON.parse(e.data);addMsg({w:d.user||'Un fan',t:(d.gift||'Cadeau')+' 🎁 · '+(d.points||0)+' pts',gift:1,c:0});for(var k=0;k<5;k++)setTimeout(heart,k*90);});
  es.addEventListener('ticket',function(e){var d=JSON.parse(e.data);addMsg({w:d.user||'Un fan',t:'a pris son ticket 🎟️',c:3});});
  es.onerror=function(){document.querySelector('.role').textContent='Console · DIRECT · reconnexion…';};
}
</script>
