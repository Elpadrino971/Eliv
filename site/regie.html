<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Console Régie VybzzZ</title>
<meta name="description" content="Console opérateur de régie VybzzZ : mur de fans avec contrôles (micro, retirer), file « lever la main » (donner / refuser le micro), chat, top fans, missions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap">
<style>
:root{
  --stage:#0A1630; --tile:#13244A; --panel:#0C1A3A; --panel-2:#16274E;
  --ivory:#F4EFE3; --muted:#8B93A7; --muted-2:#5C6577;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.06);
  --gold:#E6C76A; --gold-2:#C6A75E; --gold-soft:rgba(230,199,106,.14);
  --live:#FF4D5E; --rose:#F0679B; --ok:#63D6A6;
  --sans:"Inter",system-ui,sans-serif; --display:"Sora",var(--sans); --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ivory);font-family:var(--sans);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block}
.icon{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

.stage{display:flex;height:100vh;min-height:0}
.left{flex:1;min-width:0;display:flex;flex-direction:column}
.side{width:346px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

/* top */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.logo{display:flex;flex-direction:column;line-height:1;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;
  background:linear-gradient(180deg,#F6E4A6,#C6A75E);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:8.5px;letter-spacing:.42em;color:var(--gold-2);margin-top:3px;font-weight:600}
.role{flex:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);
  background:rgba(230,199,106,.1);border:1px solid var(--gold-soft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.gift-banner{margin:0 auto;display:flex;align-items:center;gap:12px;padding:9px 20px 9px 14px;border-radius:999px;
  background:radial-gradient(120% 180% at 0% 50%,rgba(240,103,155,.28),rgba(230,199,106,.12) 60%,transparent);
  border:1px solid rgba(240,103,155,.4);box-shadow:0 0 30px -8px rgba(240,103,155,.5)}
.gift-banner .rose{font-size:26px}.gift-banner b{font-size:16px}.gift-banner small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:blink 1.5s infinite}
.pill b{font-weight:700}.pill .n{color:var(--muted);font-weight:600}
@keyframes blink{50%{opacity:.35}}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}

/* grille */
.grid-wrap{flex:1;min-height:0;padding:16px 18px}
.grid{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px}
.tile{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:0;background:var(--tile);isolation:isolate;transition:border-color .4s,box-shadow .4s}
.tile__cam{position:absolute;inset:0;z-index:-1}
.tile__cam::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 30%,rgba(255,255,255,.10),transparent 70%),linear-gradient(180deg,transparent 40%,rgba(8,18,42,.85))}
.tile video.camv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;background:#000}
.tile.free{opacity:.35}
/* ── DIRECT : flux de l'artiste en grand, fans sur scène à droite, aucune case vide ── */
.grid.live{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.grid.live.withfans{grid-template-columns:minmax(0,3fr) minmax(0,1fr)}
.grid.live.withfans.many{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.fanstrip{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:12px;min-height:0}
.many .fanstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile.main{background:#0B1734}
.tile.main video.camv{object-fit:contain}
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;color:var(--muted)}
.wait b{font-family:var(--display);font-size:22px;color:var(--ivory);font-weight:700}
.wait small{font-size:12.5px;color:var(--muted-2);max-width:420px}
.wait .pulse{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);animation:blink 1.6s infinite}
.badge.art{background:linear-gradient(180deg,#FFB3C6,#F0679B);color:#2A0816}
.gift-banner[hidden],.raise[hidden]{display:none}
.tile__mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:64px;color:rgba(255,255,255,.14);z-index:-1}
.tile.speaking{border-color:rgba(230,199,106,.75);box-shadow:0 0 0 1px rgba(230,199,106,.5),0 0 26px -6px rgba(230,199,106,.55)}
.tile.onair{border-color:rgba(99,214,166,.8);box-shadow:0 0 0 1px rgba(99,214,166,.5),0 0 26px -6px rgba(99,214,166,.55)}
.name{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:999px;
  background:rgba(10,20,44,.66);backdrop-filter:blur(6px);border:1px solid var(--line);font-weight:600;font-size:13px}
.name .m{width:16px;height:16px;color:var(--gold)}.name .m.off{color:var(--live)}
.badge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 20px);
  padding:6px 12px;border-radius:999px;white-space:nowrap;background:linear-gradient(180deg,#F6E4A6,#D8B45A);color:#2A2008;
  font-weight:800;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 5px 16px -5px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.badge.air{background:linear-gradient(180deg,#8FF0C4,#4FC993);color:#062A18}
.badge span{font-size:12px}
/* contrôles opérateur sur chaque vignette (au survol) */
.ops{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:6px;opacity:0;transform:translateY(4px);transition:.2s}
.tile:hover .ops{opacity:1;transform:none}
.op{width:34px;height:34px;border-radius:50%;background:rgba(10,20,44,.85);border:1px solid var(--line);display:grid;place-items:center;color:var(--ivory)}
.op:hover{border-color:var(--gold)}.op.danger:hover{border-color:var(--live);color:var(--live)}
.op .icon{width:17px;height:17px}

/* barre opérateur */
.controls{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-top:1px solid var(--line-2);position:relative}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 16px;border-radius:14px;color:var(--muted);transition:.18s;min-width:74px;position:relative}
.ctrl:hover{color:var(--ivory);background:var(--panel-2)}
.ctrl small{font-size:11px;font-weight:600;white-space:nowrap}
.ctrl .badge-n{position:absolute;top:2px;right:12px;background:var(--gold);color:#22190A;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:999px}
.leave{position:absolute;right:18px;display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;background:linear-gradient(180deg,#FF5E6E,#E23B4C);color:#fff;font-weight:700}
.status{position:absolute;left:18px;display:flex;align-items:center;gap:12px;color:var(--muted-2);font-size:11px;font-weight:600}
.status .hd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
/* chrono de fin de live (prolonger / réduire) */
.clockbox{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);margin-right:6px}
.clockbox .cl{font-size:14px;color:var(--muted)}
.clockbox b{font-family:var(--display);font-size:18px;color:var(--gold);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.clockbox button{padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--ivory)}
.clockbox button:hover{border-color:var(--gold)}

/* panneau droit */
.tabs{display:flex;padding:6px 8px;gap:2px;border-bottom:1px solid var(--line-2)}
.tab{flex:1;padding:12px 2px;font-weight:700;font-size:12px;color:var(--muted);border-radius:10px;position:relative;white-space:nowrap}
.tab.active{color:var(--ivory)}
.tab.active::after{content:"";position:absolute;left:20%;right:20%;bottom:2px;height:2.5px;border-radius:2px;background:var(--gold)}
.tab .q{display:inline-block;margin-left:5px;background:var(--gold);color:#22190A;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;vertical-align:1px}
.panelbody{flex:1;min-height:0;display:flex;flex-direction:column}
.tabpane{display:none;flex:1;min-height:0;flex-direction:column}
.tabpane.on{display:flex}
.chat{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:13px;scrollbar-width:thin}
.msg{display:flex;gap:10px;align-items:flex-start}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0A1120}
.msg .head{display:flex;align-items:baseline;gap:8px}.msg .who{font-weight:700;font-size:13px;color:var(--gold)}
.msg .time{font-size:10.5px;color:var(--muted-2);font-weight:600}.msg .txt{color:#DCE0EA;font-size:13.5px;margin-top:1px}
.msg.gift{background:var(--gold-soft);border:1px solid rgba(230,199,106,.28);border-radius:12px;padding:9px 11px;margin:-2px -2px}
.msg.gift .txt{color:var(--gold);font-weight:600}
.raise{margin:0 14px 12px;padding:11px 12px;border-radius:14px;background:rgba(230,199,106,.08);border:1px solid rgba(230,199,106,.35);display:flex;align-items:center;gap:11px}
.raise .h{font-size:20px}.raise b{font-weight:700}.raise small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.raise .see{margin-left:auto;padding:8px 14px;border-radius:9px;background:var(--gold);color:#22190A;font-weight:700;font-size:13px;white-space:nowrap}
.composer{display:flex;align-items:center;gap:9px;padding:12px 14px;border-top:1px solid var(--line-2)}
.composer input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--ivory);font-size:13.5px}
.composer input:focus{outline:none;border-color:var(--gold-soft)}
.send{width:42px;height:42px;flex:none;border-radius:50%;background:var(--gold);color:#22190A;display:grid;place-items:center}
/* file d'attente */
.queue{padding:10px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.req{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line)}
.req b{font-weight:700}.req small{display:block;color:var(--muted);font-size:11.5px}
.req .acts{margin-left:auto;display:flex;gap:6px}
.give{padding:8px 12px;border-radius:9px;background:var(--ok);color:#062A18;font-weight:700;font-size:12.5px;white-space:nowrap}
.deny{padding:8px 10px;border-radius:9px;background:rgba(255,77,94,.15);color:#FF8A96;font-weight:700;font-size:12.5px;border:1px solid rgba(255,77,94,.3)}
.okb{padding:8px 10px;border-radius:9px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12.5px;border:1px solid rgba(230,199,106,.35)}
.req.feat{border-color:rgba(230,199,106,.6);background:rgba(230,199,106,.08)}
/* questions : 2 lignes — texte en pleine largeur, actions dessous (la colonne est étroite) */
.req.qa{flex-wrap:wrap;align-items:flex-start}
.req.qa>div:nth-child(2){flex:1 1 0;min-width:0}
.req.qa>div:nth-child(2) b{display:block;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.req.qa .acts{flex-basis:100%;margin-left:0;justify-content:flex-end;gap:6px;margin-top:2px}
.req.qa .acts button{font-size:12px;padding:7px 10px;white-space:nowrap}
.req .lk{min-width:44px;text-align:center;line-height:1}.req .lk b{display:block;font-family:var(--display);font-size:18px;color:var(--gold)}.req .lk small{font-size:10px;color:var(--muted)}
.em{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* fans / missions */
.fan{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-2)}
.fan .rk{width:24px;font-family:var(--display);font-weight:800;color:var(--muted-2);text-align:center;font-size:15px}
.fan.top1 .rk,.fan.top2 .rk,.fan.top3 .rk{color:var(--gold)}
.fan .nm{font-weight:600;flex:1}.fan .amt{color:var(--gold);font-weight:700;display:flex;align-items:center;gap:5px}
.coin{width:15px;height:15px;border-radius:50%;background:linear-gradient(180deg,#F6E4A6,#C6A75E)}
.mission{padding:14px 4px;border-bottom:1px solid var(--line-2)}
.mission .row{display:flex;align-items:center;gap:10px}.mission .emo{font-size:20px}.mission b{flex:1;font-weight:600}.mission .rw{color:var(--gold);font-weight:700;font-size:12.5px}
.bar{height:7px;border-radius:9px;background:var(--panel-2);margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);z-index:60;padding:11px 18px;border-radius:12px;
  background:rgba(12,26,58,.95);border:1px solid var(--line);font-weight:600;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hearts{position:absolute;right:352px;bottom:80px;width:80px;height:60%;pointer-events:none;z-index:5}
.fx{position:absolute;bottom:0;font-size:24px;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(-46vh) translateX(var(--dx,0)) scale(1.1);opacity:0}}
@media(max-width:1100px){.side{width:300px}.hearts{right:306px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* ── MOBILE (téléphone en régie) ─────────────────────────────────────────── */
.wallToggle{display:none}
@media(max-width:820px){
  body{overflow:hidden}
  .stage{flex-direction:column;height:100dvh}
  .left{flex:none}
  .top{padding:8px 10px;gap:8px}
  .logo b{font-size:18px}.logo span{font-size:7px}
  .gift-banner,.role,.icon-btn{display:none}
  .pill{padding:6px 10px;font-size:12px;margin-left:auto}
  .wallToggle{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
  .grid-wrap{padding:6px 10px 8px}
  .grid-wrap.collapsed{display:none}
  .grid{height:auto;grid-template-rows:none;gap:6px}
  .tile{aspect-ratio:1/1;border-radius:10px}
  .grid.live{display:flex;flex-direction:column}.tile.main{aspect-ratio:16/10}
  .fanstrip,.many .fanstrip{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;gap:6px}
  .wait b{font-size:15px}
  .tile__mono{font-size:26px}
  .name{left:4px;bottom:4px;padding:3px 6px 3px 4px;font-size:10px;gap:3px;max-width:calc(100% - 66px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .name .m{width:11px;height:11px;flex:none}
  .badge{top:4px;right:4px;padding:2px 6px;font-size:7.5px;gap:3px;max-width:calc(100% - 8px)}.badge span{font-size:9px}
  .ops{opacity:1;transform:none;right:4px;bottom:4px;gap:3px}
  .op{width:26px;height:26px}.op .icon{width:13px;height:13px}
  .controls{padding:6px 8px;gap:2px;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .status{position:static;font-size:10px;gap:6px;margin-right:6px;flex:none;white-space:nowrap}
  .ctrl{min-width:0;padding:6px 8px;flex:none}.ctrl small{display:none}.ctrl .badge-n{right:2px}
  .clockbox{padding:4px 6px;margin-right:2px;flex:none}.clockbox b{min-width:44px;font-size:14px}.clockbox button{padding:4px 6px;font-size:11px}
  .leave{position:static;padding:7px 10px;font-size:12px;flex:none;margin-left:auto}
  .side{width:100%;border-left:0;border-top:1px solid var(--line);flex:1;min-height:0}
  .tabs{padding:4px 6px}.tab{font-size:11px;padding:9px 2px}.tab .q{margin-left:3px}
  .chat{padding:10px 12px;gap:10px}.msg .txt{font-size:13px}
  .raise{margin:0 10px 8px;padding:9px 10px;gap:8px}.raise .see{padding:7px 10px;font-size:12px}
  .composer{padding:8px 10px}.composer input{padding:10px 14px}
  .hearts,.toast{display:none}
}
</style>

<div class="stage">
  <div class="left">
    <header class="top">
      <div class="logo"><b>VybzzZ</b><span>LIVE BEGINS HERE</span></div>
      <span class="role">Console · régie</span>
      <button class="wallToggle" id="wallToggle" type="button">Mur ▴</button>
      <div class="gift-banner" id="giftBanner"><span class="rose" id="gbE">🌹</span><div><b id="gbW">Rose ×20</b><small id="gbF">envoyé par Lyna_973</small></div></div>
      <div class="top-right">
        <div class="pill"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#i-users"/></svg><b id="viewers">245</b><span class="dot"></span><span class="n">en direct</span></div>
        <button class="icon-btn" aria-label="Plus">···</button>
      </div>
    </header>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
    <div class="controls">
      <div class="status"><span class="hd">HD</span><span id="micStatus">🔇 Aucun micro ouvert</span></div>
      <div class="clockbox" title="Fin du live — prolonger / réduire"><span class="cl">⏱</span><b id="cT">--:--</b><button data-dm="-5" title="Réduire de 5 min">−5</button><button data-dm="5" title="Prolonger de 5 min">+5</button><button data-dm="10" title="Prolonger de 10 min">+10</button><button id="cSet" title="Définir les minutes restantes / terminer">⚙</button></div>
      <button class="ctrl" id="muteAll"><svg class="icon" viewBox="0 0 24 24"><use href="#i-mic-off"/></svg><small>Couper tous les micros</small></button>
      <button class="ctrl" id="goQueue"><svg class="icon" viewBox="0 0 24 24"><use href="#i-hand"/></svg><small>File d'attente</small><span class="badge-n" id="qn">0</span></button>
      <button class="ctrl" id="goalBtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-target"/></svg><small>Objectif rappel</small></button>
      <button class="ctrl" id="testGift"><svg class="icon" viewBox="0 0 24 24"><use href="#i-gift"/></svg><small>Cadeau test</small></button>
      <button class="leave"><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px"><use href="#i-leave"/></svg>Quitter</button>
    </div>
  </div>

  <aside class="side">
    <div class="tabs">
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="queue">File<span class="q" id="qn2">0</span></button>
      <button class="tab" data-tab="fans">Top fans</button>
      <button class="tab" data-tab="questions">Questions<span class="q" id="qqn">0</span></button>
      <button class="tab" data-tab="missions" id="missionsTab">Missions</button>
    </div>
    <div class="panelbody">
      <div class="tabpane on" data-pane="chat" style="min-height:0">
        <div class="chat" id="chat"></div>
        <div class="raise" id="raiseCard" hidden>
          <span class="h">✋</span><div><b id="rName">—</b> demande à rejoindre l'écran<small>Il a levé la main</small></div>
          <button class="see" id="rSee">Voir la file</button>
        </div>

        <div class="em" style="padding:8px 14px 0">Triées par likes · la plus likée passe seule à l'écran dès <b id="qMin">3</b> ❤️, sauf si tu en choisis une.</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<script>
// ── MODE DIRECT : regie.html?event=<id du concert>&key=<clé API>[&api=https://api.vybzzz.online/api]
// Sans paramètres : démo (messages / mains simulés). En direct : chat centralisé,
// cadeaux et billets confirmés arrivent par SSE ; la régie écrit dans le vrai chat.
// RÈGLE DIRECT : AUCUNE donnée factice — toutes les listes de démo ci-dessous sont
// vides en direct et les minuteries de simulation ne tournent que si !LIVE.
var Q=new URLSearchParams(location.search),LIVE=!!(Q.get('event')&&Q.get('key')),API=(Q.get('api')||'https://api.vybzzz.online/api').replace(/\/$/,'');
// RÈGLE : un seul micro ouvert à la fois sur le mur (c'est un concert). Les fans
// arrivent micro coupé ; ouvrir un micro coupe tous les autres (voir openMic).
var GUESTS=LIVE?[]:[
 {n:'Kay West',mic:0,badge:{t:'Top Supporter',e:'👑'},hue:24},
 {n:'Nesly',mic:0,badge:{t:'Invitée spéciale',e:'⭐'},hue:300},
 {n:'DJ Glad',mic:0,badge:{t:'Meilleur Tippeur',e:'💸'},hue:266},
 {n:'Maya',mic:0,hue:288},{n:'Sabrina',mic:0,hue:210},{n:'Ruddy',mic:0,hue:150},
 {n:'Léa',mic:0,hue:330},{n:'Tom_973',mic:0,hue:40},{n:'Jordan',mic:0,hue:190},
];
function muteEveryone(){GUESTS.forEach(function(g){g.mic=0;g.onair=0;});}
function openMic(i){var wasOpen=GUESTS.filter(function(g){return g.mic;}).map(function(g){return g.n;});muteEveryone();GUESTS[i].mic=1;return wasOpen;}
function updateMicStatus(){var on=GUESTS.find(function(g){return g.mic;});var el=document.getElementById('micStatus');if(el)el.innerHTML=on?'🎙️ Micro ouvert : <b style="color:var(--gold)">'+on.n+'</b>':'🔇 Aucun micro ouvert';}
var AV=['#F0679B','#E6C76A','#7EA6FF','#63D6A6','#C58BFF','#FF9F6B','#63C6D6','#F58BB0','#9DD16B'];
function ini(n){return n.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,1).toUpperCase();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2200);}

// ── mur + contrôles opérateur ──
var grid=document.getElementById('grid');
if(LIVE){ // en direct : compteur réel (0 tant que la salle Zego n'a rien dit), pas de faux bandeau cadeau, pas de missions
  document.getElementById('viewers').textContent='0';
  document.getElementById('giftBanner').hidden=true;document.getElementById('gbW').textContent='';document.getElementById('gbF').textContent='';
  document.getElementById('missionsTab').hidden=true;
}
function renderGrid(){
  grid.innerHTML='';
  GUESTS.forEach(function(g,i){
    var t=document.createElement('div');t.className='tile'+(g.onair?' onair':(g.mic?' speaking':''));
    t.innerHTML='<div class="tile__cam" style="background:linear-gradient(150deg,hsl('+g.hue+' 42% 26%),hsl('+((g.hue+40)%360)+' 38% 12%))"></div>'+
     '<div class="tile__mono">'+ini(g.n)+'</div>'+
     (g.onair?'<div class="badge air"><span>🎙️</span>À l\'antenne</div>':(g.badge?'<div class="badge"><span>'+g.badge.e+'</span>'+g.badge.t+'</div>':''))+
     '<div class="name"><svg class="m'+(g.mic?'':' off')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#'+(g.mic?'i-mic':'i-mic-off')+'"/></svg>'+g.n+'</div>'+
     '<div class="ops"><button class="op" title="'+(g.mic?'Couper le micro':'Donner le micro')+'" data-mic="'+i+'"><svg class="icon" viewBox="0 0 24 24"><use href="#'+(g.mic?'i-mic-off':'i-mic')+'"/></svg></button>'+
     '<button class="op danger" title="Retirer de l\'écran" data-rm="'+i+'"><svg class="icon" viewBox="0 0 24 24"><use href="#i-x"/></svg></button></div>';
    grid.appendChild(t);
  });
  grid.querySelectorAll('[data-mic]').forEach(function(b){b.onclick=function(){var i=+b.dataset.mic,g=GUESTS[i];
    if(g.mic){g.mic=0;g.onair=0;renderGrid();toast(g.n+' : micro coupé');}
    else{var prev=openMic(i);renderGrid();toast(g.n+' : micro ouvert'+(prev.length?' — '+prev.join(', ')+' coupé':''));}};});
  grid.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){var g=GUESTS[+b.dataset.rm];GUESTS[+b.dataset.rm]={n:'Libre',mic:0,hue:220,free:1};renderGrid();toast(g.n+' retiré de l\'écran');};});
  updateMicStatus();
}
if(!LIVE)renderGrid();
document.getElementById('muteAll').onclick=function(){GUESTS.forEach(function(g){g.mic=0;g.onair=0;});renderGrid();toast('Tous les micros coupés');};

// ── file "lever la main" ──
var QUEUE=LIVE?[]:[{n:'Enzo',w:'il y a 20 s'},{n:'Naïma',w:'il y a 1 min'},{n:'Brayan',w:'il y a 2 min'}];
function renderQueue(){
  var q=document.getElementById('queue');q.innerHTML='';
  document.getElementById('qn').textContent=QUEUE.length;document.getElementById('qn2').textContent=QUEUE.length;
  var rc=document.getElementById('raiseCard');
  if(!QUEUE.length){q.innerHTML='<div class="empty">Personne n\'a levé la main.</div>';rc.hidden=true;return;}
  rc.hidden=false;document.getElementById('rName').textContent=QUEUE[0].n;
  QUEUE.forEach(function(r,i){
    var d=document.createElement('div');d.className='req';
    d.innerHTML='<span class="av" style="background:'+AV[(i+3)%AV.length]+'">'+esc(ini(r.n))+'</span><div><b>'+esc(r.n)+'</b><small>✋ a levé la main · '+esc(r.w)+'</small></div>'+
     '<div class="acts"><button class="give" data-give="'+i+'">🎙️ Donner le micro</button><button class="deny" data-deny="'+i+'">Refuser</button></div>';
    q.appendChild(d);
  });
  q.querySelectorAll('[data-give]').forEach(function(b){b.onclick=function(){give(+b.dataset.give);};});
  q.querySelectorAll('[data-deny]').forEach(function(b){b.onclick=function(){var r=QUEUE.splice(+b.dataset.deny,1)[0];renderQueue();toast(r.n+' : demande refusée');};});
}
function give(i){
  var r=QUEUE.splice(i,1)[0];
  // slot : libre > micro coupé > dernier
  var s=GUESTS.findIndex(function(g){return g.free;});if(s<0)s=GUESTS.findIndex(function(g){return !g.mic&&!g.badge;});if(s<0)s=GUESTS.length-1;
  muteEveryone(); // un seul micro : le nouvel intervenant prend la parole, les autres sont coupés
  GUESTS[s]={n:r.n,mic:1,onair:1,hue:Math.floor(Math.random()*360)};
  renderGrid();renderQueue();toast('🎙️ '+r.n+' est à l\'antenne');
  for(var k=0;k<5;k++)setTimeout(heart,k*90);
}
renderQueue();
function showTab(id){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.tab===id);});document.querySelectorAll('.tabpane').forEach(function(p){p.classList.toggle('on',p.dataset.pane===id);});}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){showTab(t.dataset.tab);};});
document.getElementById('goQueue').onclick=function(){showTab('queue');};
document.getElementById('rSee').onclick=function(){showTab('queue');};
// nouvelles mains de temps en temps
var HANDS=['Océane','Steeve','Wendy','Lucas973'];var hi=0;
if(!LIVE)setInterval(function(){QUEUE.push({n:HANDS[hi%HANDS.length],w:'à l\'instant'});hi++;renderQueue();toast('✋ '+QUEUE[QUEUE.length-1].n+' a levé la main');},21000);

// ── chat ──
var MSGS=LIVE?[]:[{w:'Lyna_973',t:'Rose ×20 🌹',time:'20:14',gift:1,c:0},{w:'Kevin',t:'Quel son ! 🔥',time:'20:14',c:2},{w:'Mimi_off',t:'Incroyable ! ❤️',time:'20:14',c:7},
 {w:'Tifany',t:'Vous êtes au top 🙌',time:'20:15',c:4},{w:'Lucas973',t:'Respect 👏',time:'20:15',c:6},{w:'SarahK',t:'On veut la suite ! 🎶',time:'20:15',c:1},{w:'Chris',t:'Big up !',time:'20:15',c:5}];
var chat=document.getElementById('chat');
function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function chatEmpty(){if(!chat.children.length)chat.innerHTML='<div class="empty" id="chatEmpty">Aucun message pour l\'instant.</div>';}
function addMsg(m){var e0=document.getElementById('chatEmpty');if(e0)e0.remove();
  var el=document.createElement('div');el.className='msg'+(m.gift?' gift':'');
  el.innerHTML='<div class="av" style="background:'+AV[(m.c||0)%AV.length]+'">'+esc(ini(m.w||''))+'</div><div><div class="head"><span class="who">'+esc(m.w)+'</span><span class="time">'+esc(m.time||now())+'</span></div><div class="txt">'+esc(m.t)+'</div></div>';
  chat.appendChild(el);while(chat.children.length>300)chat.firstChild.remove();chat.scrollTop=chat.scrollHeight;}
MSGS.forEach(addMsg);chatEmpty();
var INC=[{w:'Océane',t:'🔥 énorme',c:1},{w:'Brayan',t:'Guadeloupe présente 🇬🇵',c:4},{w:'Naïma',t:'j\'achète le ticket',c:7},{w:'Steeve',t:'la voix 😍',c:2}];var ii=0;
if(!LIVE)setInterval(function(){addMsg(INC[ii%INC.length]);ii++;},4500);
function send(){var i=document.getElementById('msgInput'),t=i.value.trim();if(!t)return;i.value='';
  if(LIVE){fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/messages',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({text:t,user:'Prod VybzzZ'})})
    .then(function(r){if(!r.ok)throw 0;addMsg({w:'Prod VybzzZ',t:t,c:1});}).catch(function(){toast('Envoi impossible (clé / réseau)');});}
  else addMsg({w:'Prod VybzzZ',t:t,c:1});}
document.getElementById('sendBtn').onclick=send;document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});

// ── fans / missions ──
// Direct : classement réel (GET /live/:event/top-fans = points de cadeaux confirmés), rechargé à chaque cadeau.
var FANS=LIVE?[]:[['Lyna_973',2410],['DJ Glad',1980],['Kevin',1220],['Mimi_off',960],['Tifany',740],['SarahK',520]];
var fe=document.getElementById('fans');
function renderFans(){fe.innerHTML='';
  if(!FANS.length){fe.innerHTML='<div class="empty">Aucun cadeau reçu pour l\'instant.<br><small class="em">Le classement se remplit avec les cadeaux confirmés.</small></div>';return;}
  FANS.forEach(function(f,i){var d=document.createElement('div');d.className='fan'+(i<3?' top'+(i+1):'');
  d.innerHTML='<span class="rk">'+(i+1)+'</span><span class="av" style="width:30px;height:30px;background:'+AV[i%AV.length]+'">'+esc(ini(f[0]))+'</span><span class="nm">'+esc(f[0])+'</span><span class="amt"><span class="coin"></span>'+(+f[1]||0).toLocaleString('fr-FR')+'</span>';fe.appendChild(d);});}
renderFans();
var MISS=LIVE?[]:[['🎁','Envoie 5 cœurs','+10 pts',80],['🎟️','Achète ton ticket','+50 pts',0],['⏱️','Reste 10 min','+15 pts',60],['🤝','Invite un ami','+30 pts',33]];
var me=document.getElementById('missions');MISS.forEach(function(m){var d=document.createElement('div');d.className='mission';
  d.innerHTML='<div class="row"><span class="emo">'+m[0]+'</span><b>'+m[1]+'</b><span class="rw">'+m[2]+'</span></div><div class="bar"><i style="width:'+m[3]+'%"></i></div>';me.appendChild(d);});

// ── divers ──
document.getElementById('wallToggle').onclick=function(){var w=document.querySelector('.grid-wrap');w.classList.toggle('collapsed');this.textContent=w.classList.contains('collapsed')?'Mur ▾':'Mur ▴';};
document.getElementById('goalBtn').onclick=function(){
  if(!LIVE){toast('🌹 Objectif « 100 roses = un rappel » affiché sur le Stage');return;}
  var v=prompt('Objectif du public (nombre de roses pour un rappel) :','100');if(v===null)return;var n=parseInt(v,10);if(isNaN(n)||n<1)return;
  fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/emit',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({type:'goal',title:n+' roses = un rappel 🌹',max:n})})
    .then(function(r){toast(r.ok?'🌹 Objectif « '+n+' roses » affiché sur le Stage':'Échec (clé / réseau)');}).catch(function(){toast('Échec (réseau)');});};
document.getElementById('testGift').onclick=function(){
  if(LIVE){fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/emit',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({type:'gift',gift:'Rose',user:'Prod VybzzZ (test)',points:100})})
    .then(function(r){toast(r.ok?'Cadeau test envoyé au Stage':'Échec (clé / réseau)');}).catch(function(){toast('Échec (réseau)');});}
  else{addMsg({w:'Prod VybzzZ',t:'Rose ×5 🌹 (test)',gift:1,c:1});toast('Cadeau test (démo)');}
  for(var k=0;k<8;k++)setTimeout(heart,k*70);};
var hearts=document.getElementById('hearts'),EMO=['❤️','🧡','💛','🔥','👏'];
function heart(){var s=document.createElement('span');s.className='fx';s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
  s.style.right=(Math.random()*50)+'px';s.style.fontSize=(20+Math.random()*16)+'px';s.style.setProperty('--dx',((Math.random()*60-30)|0)+'px');
  var d=3.2+Math.random()*1.8;s.style.animationDuration=d+'s';hearts.appendChild(s);setTimeout(function(){s.remove();},d*1000+100);}
if(!LIVE&&!matchMedia('(prefers-reduced-motion:reduce)').matches){setInterval(heart,700);} // démo seulement : en direct, les cœurs suivent les vrais cadeaux

// ── Compte à rebours de fin de live : la régie prolonge / réduit / termine ──
var CLOCK={endsAt:null,offset:0};
function fmt(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+(h?('0'+m).slice(-2):m)+':'+('0'+x).slice(-2);}
function renderClock(){var el=document.getElementById('cT');if(!CLOCK.endsAt){el.textContent='--:--';return;}var rem=(CLOCK.endsAt-(Date.now()+CLOCK.offset))/1000;el.textContent=fmt(rem);el.style.color=rem<=120?'var(--live)':'var(--gold)';}
setInterval(renderClock,1000);
function setClockLocal(endsAt,serverNow){if(serverNow)CLOCK.offset=new Date(serverNow).getTime()-Date.now();CLOCK.endsAt=endsAt?new Date(endsAt).getTime():null;renderClock();}
function clockAction(action,minutes){
  if(LIVE){return fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/clock',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({action:action,minutes:minutes,by:'Régie'})})
    .then(function(r){return r.json();}).then(function(j){if(j.data)setClockLocal(j.data.ends_at,j.data.server_now);toast(j.status==='success'?'Chrono mis à jour':(j.message||'Échec'));}).catch(function(){toast('Échec (réseau)');});}
  var now=Date.now(),base=CLOCK.endsAt&&CLOCK.endsAt>now?CLOCK.endsAt:now;
  if(action==='set')CLOCK.endsAt=now+minutes*60000;else if(action==='end')CLOCK.endsAt=now;else CLOCK.endsAt=Math.max(now,base+(action==='reduce'?-1:1)*minutes*60000);
  renderClock();toast('Chrono : '+(action==='set'?minutes+' min':action==='end'?'fin du live':(action==='reduce'?'−':'+')+minutes+' min')+' (démo)');return Promise.resolve();
}
document.querySelectorAll('[data-dm]').forEach(function(b){b.onclick=function(){var d=+b.dataset.dm;clockAction(d<0?'reduce':'extend',Math.abs(d));};});
document.getElementById('cSet').onclick=function(){var cur=CLOCK.endsAt?Math.max(0,Math.round((CLOCK.endsAt-(Date.now()+CLOCK.offset))/60000)):45;
  var v=prompt('Minutes restantes (ex. 45) — 0 pour terminer le live maintenant :',cur);if(v===null)return;var m=parseInt(v,10);if(isNaN(m)||m<0)return;
  if(m===0&&!confirm('Terminer le live maintenant ?'))return;clockAction(m===0?'end':'set',m);};
if(!LIVE)setClockLocal(new Date(Date.now()+45*60000).toISOString());

// ── Questions du public (Q&A) ──
// Démo : liste locale. Direct : API /live/:event/questions + événement SSE 'questions_changed'.
var QUESTIONS=LIVE?[]:[{id:1,text:'Tu feras une date en Guadeloupe cette année ?',user:'Lyna_973',likes:47,status:'open'},{id:2,text:'C\'est quoi le prochain single ?',user:'Kevin',likes:31,status:'open'},{id:3,text:'Un duo avec Nesly, c\'est possible ?',user:'Maya_Fan',likes:22,status:'open'},{id:4,text:'Tu répètes combien d\'heures par jour ?',user:'Tifany',likes:9,status:'open'}];
var QMIN=3;
function qAction(id,action){
  if(LIVE){return fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/questions/'+id+'/'+action,{method:'POST',headers:{'X-API-Key':Q.get('key')}}).then(function(r){if(!r.ok)toast('Action impossible');});}
  var q=QUESTIONS.find(function(x){return x.id===id;});if(!q)return Promise.resolve();
  if(action==='feature'){QUESTIONS.forEach(function(x){if(x.status==='featured')x.status='open';});q.status='featured';}
  else if(action==='unfeature')q.status='open';else if(action==='answered')q.status='answered';else if(action==='hide')q.status='hidden';
  renderQuestions();return Promise.resolve();
}
function renderQuestions(){
  var host=document.getElementById('qlist');var list=QUESTIONS.filter(function(q){return q.status==='open'||q.status==='featured';})
    .sort(function(a,b){return (b.status==='featured')-(a.status==='featured')||b.likes-a.likes||a.id-b.id;});
  document.getElementById('qqn').textContent=list.length;document.getElementById('qMin').textContent=QMIN;
  host.innerHTML=list.length?'':'<div class="empty">Aucune question pour l\'instant.</div>';
  list.forEach(function(q,i){var d=document.createElement('div');d.className='req qa'+(q.status==='featured'?' feat':'');
    var top=q.status==='featured'?'📺 À l\'écran (choisie)':(i===0&&q.likes>=QMIN?'📺 À l\'écran (la plus likée)':'');
    d.innerHTML='<div class="lk"><b>'+(+q.likes||0)+'</b><small>❤️</small></div><div style="min-width:0"><b>'+esc(q.text)+'</b><small>— '+esc(q.user)+(top?' · <span style="color:var(--gold)">'+top+'</span>':'')+'</small></div>'+
      '<div class="acts">'+(q.status==='featured'?'<button class="okb" data-q="'+q.id+'" data-a="unfeature">Retirer</button>':'<button class="give" data-q="'+q.id+'" data-a="feature">📺 À l\'écran</button>')+
      '<button class="okb" data-q="'+q.id+'" data-a="answered">✅ Répondu</button><button class="deny" data-q="'+q.id+'" data-a="hide">Masquer</button></div>';
    host.appendChild(d);});
  host.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){qAction(+b.dataset.q,b.dataset.a).then(function(){toast({feature:'Question envoyée au Stage',unfeature:'Retour à la plus likée',answered:'Marquée répondue',hide:'Question masquée'}[b.dataset.a]);});};});
}
function loadQuestions(){
  renderQuestions(); // direct : liste vide tant que l'API n'a pas répondu
  if(!LIVE)return;
  fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/questions',{headers:{'X-API-Key':Q.get('key')}}).then(function(r){return r.json();})
    .then(function(j){QUESTIONS=j.data||[];if(j.min_likes)QMIN=j.min_likes;renderQuestions();}).catch(function(){});
}
function askQuestion(){var i=document.getElementById('qInput'),t=i.value.trim();if(t.length<3)return;i.value='';
  if(LIVE){fetch(API+'/live/'+encodeURIComponent(Q.get('event'))+'/questions',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':Q.get('key')},body:JSON.stringify({text:t,user:'Régie'})}).then(function(r){toast(r.ok?'Question proposée':'Envoi impossible');});}
  else{QUESTIONS.push({id:Date.now(),text:t,user:'Régie',likes:0,status:'open'});renderQuestions();toast('Question proposée (démo)');}}
document.getElementById('qSend').onclick=askQuestion;document.getElementById('qInput').addEventListener('keydown',function(e){if(e.key==='Enter')askQuestion();});
loadQuestions();

// ── Connexion DIRECT : historique du chat + flux SSE (chat, cadeaux, billets) ──
function giftEmoji(name){var n=String(name||'').toLowerCase();
  if(/rose/.test(n))return '🌹';if(/feu|flamme|fire/.test(n))return '🔥';if(/diam/.test(n))return '💎';
  if(/couronne|crown/.test(n))return '👑';if(/fus|rocket/.test(n))return '🚀';if(/ch[âa]teau|castle/.test(n))return '🏰';return '🎁';}
// Bandeau du haut : le DERNIER vrai cadeau reçu (masqué tant qu'il n'y en a pas).
function showGiftBanner(what,who){var b=document.getElementById('giftBanner');
  document.getElementById('gbE').textContent=giftEmoji(what);document.getElementById('gbW').textContent=what;
  document.getElementById('gbF').textContent='envoyé par '+who;b.hidden=false;clearTimeout(b._t);b._t=setTimeout(function(){b.hidden=true;},15000);}
var TF_T=null;
function loadTopFans(){if(!LIVE)return;
  fetch(API+'/live/'+EV+'/top-fans?limit=10',{headers:H}).then(function(r){return r.json();})
    .then(function(j){if(Array.isArray(j.data)){FANS=j.data.map(function(f){return [f.name||'Un fan',+f.points||0];});renderFans();}}).catch(function(){});}
function loadTopFansSoon(){clearTimeout(TF_T);TF_T=setTimeout(loadTopFans,800);}
if(LIVE){
  document.querySelector('.role').textContent='Console · DIRECT · concert #'+Q.get('event');
  var H={'X-API-Key':Q.get('key')},EV=encodeURIComponent(Q.get('event'));
  fetch(API+'/live/'+EV+'/messages?limit=50',{headers:H}).then(function(r){return r.json();})
    .then(function(j){(j.data||[]).forEach(function(m){addMsg({w:m.name||'Fan',t:m.text,c:(m.name||'').length,time:(m.created_at||'').slice(11,16)});});})
    .catch(function(){toast('Historique du chat indisponible');});
  var es=new EventSource(API+'/live/'+EV+'/stream?key='+encodeURIComponent(Q.get('key')));
  es.addEventListener('chat',function(e){var d=JSON.parse(e.data);if(d.user!=='Prod VybzzZ')addMsg({w:d.user||'Fan',t:d.text,c:(d.user||'').length});});
  es.addEventListener('gift',function(e){var d=JSON.parse(e.data),w=d.user||'Un fan',g=d.gift||'Cadeau';
    addMsg({w:w,t:g+' '+giftEmoji(g)+' · '+(d.points||0)+' pts',gift:1,c:0});showGiftBanner(g,w);loadTopFansSoon();
    for(var k=0;k<5;k++)setTimeout(heart,k*90);});
  es.addEventListener('ticket',function(e){var d=JSON.parse(e.data);addMsg({w:d.user||'Un fan',t:'a pris son ticket 🎟️',c:3});});
  es.addEventListener('note',function(e){var d=JSON.parse(e.data);if(d.text)addMsg({w:d.user||'VybzzZ',t:d.text,c:1});});
  es.addEventListener('questions_changed',loadQuestions);
  es.addEventListener('clock',function(e){var d=JSON.parse(e.data);setClockLocal(d.ends_at,d.server_now);if(d.delta_min)toast((d.by||'Régie')+' : '+(d.delta_min>0?'+':'')+d.delta_min+' min');});
  fetch(API+'/live/'+EV+'/clock',{headers:H}).then(function(r){return r.json();}).then(function(j){if(j.data)setClockLocal(j.data.ends_at,j.data.server_now);}).catch(function(){});
  es.onopen=function(){document.querySelector('.role').textContent='Console · DIRECT · concert #'+Q.get('event');};
  es.onerror=function(){document.querySelector('.role').textContent='Console · DIRECT · reconnexion…';};
}

// ═══ DIRECT : vraies cams (ZegoCloud) · badges réels · micro unique ═══
// Mur : le flux de l'ARTISTE (`<concert>_<artist_id>_main`) en grand ; les autres flux
// publiés dans la salle = fans montés sur scène (main levée accordée), à droite.
// Aucune case vide : tant que l'artiste ne diffuse pas, « En attente du flux… ».
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var SLOTS=[],MIC_STREAM=null,BADGES={},ZG=null,ARTIST_ID=null,ZSTATUS='Connexion à la salle vidéo…',ROOM_USERS={},ONLINE=null,GEST=false;
var ARTIST_SOUND=true; // régie : on écoute l'artiste (après un premier geste, règle d'autoplay)
document.addEventListener('pointerdown',function(){GEST=true;},{once:true,capture:true});
function soundOk(){return GEST||!!(navigator.userActivation&&navigator.userActivation.hasBeenActive);}
// SDK web Zego : le fichier UMD (ZegoExpressWebRTC.js) attend des globales absentes du
// navigateur (long, protobufjs/minimal, zego-express-logger, localforage) et
// window.ZegoExpressEngine n'existait jamais. On charge la version ESM empaquetée par
// jsDelivr, une seule fois (Promise du constructeur mise en cache).
var ZEGO_ESM='https://cdn.jsdelivr.net/npm/zego-express-engine-webrtc@3.12.0/+esm',_zegoP=null;
function loadZego(){
  if(typeof window.ZegoExpressEngine==='function')return Promise.resolve(window.ZegoExpressEngine);
  if(!_zegoP)_zegoP=import(ZEGO_ESM).then(function(m){var C=(m.default&&m.default.ZegoExpressEngine)||m.ZegoExpressEngine;
      if(typeof C!=='function')throw new Error('SDK vidéo introuvable');window.ZegoExpressEngine=C;return C;})
    .catch(function(e){_zegoP=null;throw e;});
  return _zegoP;}
function badgeFor(uid){uid=String(uid);
  if(BADGES.vip&&String(BADGES.vip.user_id)===uid)return {t:'Invité VIP',e:'⭐'};
  if(BADGES.top_supporter&&String(BADGES.top_supporter.user_id)===uid)return {t:'Top Supporter',e:'👑'};
  if(BADGES.best_tipper&&String(BADGES.best_tipper.user_id)===uid)return {t:'Meilleur Tippeur',e:'💸'};return null;}
function parseUid(id){var m=String(id).match(/^\d+_(.+?)_main$/);return m?m[1]:String(id);}
function isArtist(s){return ARTIST_ID!=null&&String(s.user_id)===ARTIST_ID;}
function artistSlot(){return SLOTS.find(isArtist)||(ARTIST_ID==null?SLOTS[0]:null)||null;}
function addStream(st){var uid=parseUid(st.streamID);if(SLOTS.some(function(s){return s.stream_id===st.streamID;}))return;
  var art=ARTIST_ID!=null&&uid===ARTIST_ID;if(!art&&SLOTS.filter(function(s){return !isArtist(s);}).length>=8)return;
  var s={user_id:uid,name:(st.user&&st.user.userName)||(art?'Artiste':'Fan '+uid),stream_id:st.streamID,media:null,video:null};SLOTS.push(s);renderWallLive();
  ZG.startPlayingStream(st.streamID).then(function(m){s.media=m;renderWallLive();}).catch(function(){});}
function removeStream(id){var i=SLOTS.findIndex(function(s){return s.stream_id===id;});if(i<0)return;try{ZG.stopPlayingStream(id);}catch(_){}SLOTS.splice(i,1);renderWallLive();}
// Spectateurs réels = utilisateurs de la salle Zego, hors écrans web (web_*) et hors artiste.
function renderViewers(){var fans=0,webs=0,art=0;
  Object.keys(ROOM_USERS).forEach(function(id){if(/^web_/.test(id))webs++;else if(ARTIST_ID!=null&&id===ARTIST_ID)art++;else fans++;});
  var n=fans;if(ONLINE!=null)n=Math.max(fans,ONLINE-1-webs-art); // compteur Zego : inclut cet écran
  var el=document.getElementById('viewers');if(el)el.textContent=Math.max(0,n).toLocaleString('fr-FR');}
function setZStatus(m){ZSTATUS=m;if(LIVE)renderWallLive();}
function startZego(role,say){
  var tok=null;setZStatus('Connexion à la salle vidéo…');
  fetch(API+'/live/'+EVID+'/zego-token?role='+role,{headers:H}).then(function(r){return r.json().catch(function(){return {};});})
  .then(function(j){var d=j&&j.data;if(!d||!d.app_id)throw new Error((j&&j.message)||'jeton vidéo refusé');
    tok=d;if(d.artist_id!=null&&d.artist_id!=='')ARTIST_ID=String(d.artist_id);return loadZego();})
  .then(function(Engine){
    ZG=new Engine(tok.app_id,tok.server);
    ZG.on('roomStreamUpdate',function(roomID,type,list){(list||[]).forEach(function(st){if(type==='ADD')addStream(st);else removeStream(st.streamID);});});
    ZG.on('roomUserUpdate',function(roomID,type,list){(list||[]).forEach(function(u){if(!u||u.userID==null)return;if(type==='ADD')ROOM_USERS[String(u.userID)]=u.userName||'';else delete ROOM_USERS[String(u.userID)];});renderViewers();});
    ZG.on('roomOnlineUserCountUpdate',function(roomID,count){ONLINE=+count||0;renderViewers();});
    ZG.on('soundLevelUpdate',function(levels){(levels||[]).forEach(function(l){var s=SLOTS.find(function(x){return x.stream_id===l.streamID;});if(!s||!s.video||!s.video.parentNode)return;s.video.parentNode.classList.toggle('speaking',l.soundLevel>8&&MIC_STREAM===l.streamID);});});
    try{ZG.setSoundLevelDelegate(true,300);}catch(_){}
    return ZG.loginRoom(tok.room_id,tok.token,{userID:tok.user_id,userName:tok.user_name},{userUpdate:true});
  }).then(function(ok){if(ok===false)throw new Error('connexion à la salle refusée');setZStatus('Connecté à la salle — l\'artiste n\'a pas encore lancé sa caméra.');say('Connecté à la room du concert 🎥');})
  .catch(function(e){var m=e&&e.message?e.message:'Zego';setZStatus('Vidéo indisponible : '+m);say('Cams indisponibles : '+m);});
}

function isVip(uid){return !!(BADGES.vip&&String(BADGES.vip.user_id)===String(uid));}
function camTile(s,main){var t=document.createElement('div');
  var on=!main&&!!MIC_STREAM&&MIC_STREAM===s.stream_id,b=main?null:badgeFor(s.user_id),vip=!main&&isVip(s.user_id);
  t.className='tile'+(main?' main':'')+(on?' onair':'');
  t.innerHTML=(s.media?'':'<div class="tile__mono">'+esc(ini(s.name))+'</div>')+ // l'initiale ne s'affiche que sans vidéo
    (main?'<div class="badge art"><span>🎤</span>Artiste</div>':(on?'<div class="badge air"><span>🎙️</span>À l\'antenne</div>':(b?'<div class="badge"><span>'+b.e+'</span>'+b.t+'</div>':'')))+
    '<div class="name"><svg class="m'+(on||main?'':' off')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><use href="#'+(on||main?'i-mic':'i-mic-off')+'"/></svg>'+esc(s.name)+'</div>'+
    (main?'':'<div class="ops"><button class="op" title="'+(on?'Couper le micro':'Donner le micro')+'" data-lmic="'+esc(s.user_id)+'" data-on="'+(on?1:0)+'" data-name="'+esc(s.name)+'"><svg class="icon" viewBox="0 0 24 24"><use href="#'+(on?'i-mic-off':'i-mic')+'"/></svg></button>'+
    '<button class="op" title="'+(vip?'Retirer le badge Invité VIP':'Donner le badge Invité VIP')+'" data-vip="'+esc(s.user_id)+'" data-name="'+esc(s.name)+'" style="font-size:15px">⭐</button></div>');
  if(s.media){var v=s.video;if(!v){v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.className='camv';v.srcObject=s.media;s.video=v;}
    v.muted=!(soundOk()&&(main?ARTIST_SOUND:on));t.prepend(v);if(v.play)v.play().catch(function(){v.muted=true;v.play().catch(function(){});});}
  return t;}
function waitTile(){var t=document.createElement('div');t.className='tile main';
  t.innerHTML='<div class="wait"><span class="pulse"></span><b>En attente du flux de l\'artiste…</b><small>'+esc(ZSTATUS)+'</small></div>';return t;}
function renderWallLive(){
  var art=artistSlot(),fans=SLOTS.filter(function(s){return s!==art;}).sort(function(a,b){return (badgeFor(b.user_id)?1:0)-(badgeFor(a.user_id)?1:0);}).slice(0,8);
  grid.className='grid live'+(fans.length?' withfans':'')+(fans.length>4?' many':'');
  grid.innerHTML='';grid.appendChild(art?camTile(art,true):waitTile());
  if(fans.length){var strip=document.createElement('div');strip.className='fanstrip';fans.forEach(function(s){strip.appendChild(camTile(s,false));});grid.appendChild(strip);}
  var m=SLOTS.find(function(s){return MIC_STREAM&&s.stream_id===MIC_STREAM;});
  document.getElementById('micStatus').innerHTML=m?'🎙️ Micro ouvert : <b style="color:var(--gold)">'+esc(m.name)+'</b>':'🔇 Aucun micro ouvert';
  grid.querySelectorAll('[data-lmic]').forEach(function(b){b.onclick=function(){
    if(b.dataset.on==='1'){fetch(API+'/live/'+EVID+'/mic/off',{method:'POST',headers:H}).then(function(){toast('Micro coupé');});}
    else{fetch(API+'/live/'+EVID+'/hands/'+encodeURIComponent(b.dataset.lmic)+'/grant',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({name:b.dataset.name})}).then(function(r){toast(r.ok?'🎙️ '+b.dataset.name+' a la parole (les autres sont coupés)':'Échec');});}};});
  grid.querySelectorAll('[data-vip]').forEach(function(b){b.onclick=function(){var v=isVip(b.dataset.vip);
    fetch(API+'/live/'+EVID+'/badges/vip',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(v?{user_id:null}:{user_id:b.dataset.vip,name:b.dataset.name})}).then(function(r){toast(r.ok?(v?'Badge VIP retiré':'⭐ '+b.dataset.name+' est Invité VIP'):'Échec');});};});
}
if(LIVE){
  var EVID=encodeURIComponent(Q.get('event'));
  GUESTS=[];renderGrid=function(){renderWallLive();};renderWallLive();
  give=function(i){var r=QUEUE[i];if(!r)return Promise.resolve();
    return fetch(API+'/live/'+EVID+'/hands/'+encodeURIComponent(r.user_id)+'/grant',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({name:r.n})}).then(function(x){toast(x.ok?'🎙️ '+r.n+' a la parole':'Échec');});};
  var _rq=renderQueue;renderQueue=function(){_rq();document.querySelectorAll('[data-deny]').forEach(function(b){var i=+b.dataset.deny,r=QUEUE[i];b.onclick=function(){if(r)fetch(API+'/live/'+EVID+'/hands/'+encodeURIComponent(r.user_id)+'/deny',{method:'POST',headers:H}).then(function(){toast(r.n+' : demande refusée');});};});};
  document.getElementById('muteAll').onclick=function(){fetch(API+'/live/'+EVID+'/mic/off',{method:'POST',headers:H}).then(function(){toast('Tous les micros coupés');});};
  var ago=function(at){var s=Math.max(1,Math.round((Date.now()-at)/1000));return s<60?'il y a '+s+' s':'il y a '+Math.round(s/60)+' min';};
  var applyHands=function(hs){QUEUE=(hs||[]).map(function(h){return {n:h.name||'Un fan',w:ago(h.at||Date.now()),user_id:h.user_id};});renderQueue();};
  es.addEventListener('hands',function(e){applyHands(JSON.parse(e.data).hands);});
  es.addEventListener('mic',function(e){var d=JSON.parse(e.data);MIC_STREAM=d.stream_id||null;renderWallLive();});
  es.addEventListener('badges',function(e){BADGES=JSON.parse(e.data);renderWallLive();});
  fetch(API+'/live/'+EVID+'/hands',{headers:H}).then(function(r){return r.json();}).then(function(j){if(j.data){applyHands(j.data.hands);if(j.data.mic)MIC_STREAM=j.data.mic.stream_id;renderWallLive();}}).catch(function(){});
  fetch(API+'/live/'+EVID+'/badges',{headers:H}).then(function(r){return r.json();}).then(function(j){if(j.data){BADGES=j.data;renderWallLive();}}).catch(function(){});
  document.addEventListener('click',function(){renderWallLive();},{once:true}); // un geste débloque le son
  loadTopFans();
  startZego('regie',toast);
}
</script>
