<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0e14" />
<title>Vybzzz — Feed live</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="feed">
<div class="cursor" id="cursor"></div><div class="cursor-dot" id="cursorDot"></div>
<div id="site-header"></div>

<!-- Contrôles : catégories + son -->
<div class="feed-controls feed-controls--full">
  <div class="feed-cats" id="feedCatsFull"></div>
  <button class="feed-sound" id="feedSoundFull" aria-label="Activer le son" data-cursor="hover">🔇</button>
</div>
<!-- TikTok-style vertical feed -->
<div class="feed" id="feed"></div>
<div class="feed-hint">↑ Défile pour le live suivant</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16" integrity="sha384-5E8B0pTlZZJMabWpC0fyYf6OUpe15jJij34BqBAh4NXoHAlLNOjCPRrwtOXOQFAn" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
