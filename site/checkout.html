<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0e14" />
<title>Vybzzz — Paiement</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="checkout">
<div class="grain" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><span class="aurora__blob a1"></span><span class="aurora__blob a2"></span><span class="aurora__blob a3"></span></div>
<div class="cursor" id="cursor"></div><div class="cursor-dot" id="cursorDot"></div>
<div class="scroll-progress" id="scrollProgress"></div>
<div id="site-header"></div>

<main class="page">
  <div class="page__head reveal"><span class="eyebrow">Paiement sécurisé</span><h1>Finalise ta <span class="grad">commande</span>.</h1></div>

  <div class="checkout">
    <!-- Payment card -->
    <div class="pay-card glass reveal" id="payCard">
      <div class="pay-tabs">
        <button class="pay-tab on" data-tab="card" data-cursor="hover">💳 Carte</button>
        <button class="pay-tab" data-tab="apple" data-cursor="hover"> Apple Pay</button>
        <button class="pay-tab" data-tab="google" data-cursor="hover">G Pay</button>
        <button class="pay-tab" data-tab="vybzzz" data-cursor="hover">VyBzzZ Pay</button>
      </div>

      <div id="cardForm">
        <div class="card-visual">
          <span class="card-brand" id="cvBrand">VISA</span>
          <div class="chip"></div>
          <div class="cnum" id="cvNum">•••• •••• •••• 4242</div>
          <div class="crow">
            <div><small>Titulaire</small><b id="cvName">VOTRE NOM</b></div>
            <div><small>Expire</small><b id="cvExp">12/28</b></div>
          </div>
        </div>
        <div class="field"><label>Numéro de carte</label><input id="fNum" inputmode="numeric" maxlength="19" placeholder="4242 4242 4242 4242" value="4242 4242 4242 4242" /></div>
        <div class="field"><label>Titulaire de la carte</label><input id="fName" placeholder="Alex Harrison" /></div>
        <div style="display:flex;gap:14px">
          <div class="field" style="flex:1"><label>Expiration</label><input id="fExp" placeholder="12/28" maxlength="5" value="12/28" /></div>
          <div class="field" style="flex:1"><label>CVC</label><input id="fCvc" inputmode="numeric" maxlength="4" placeholder="•••" /></div>
        </div>
      </div>

      <div id="walletForm" style="display:none;text-align:center;padding:24px 0">
        <p style="color:var(--muted);margin-bottom:16px" id="walletLabel">Paiement en un tap.</p>
      </div>

      <button class="btn btn--gold" id="payBtn" data-cursor="hover" style="width:100%;margin-top:6px"><span>Payer maintenant</span></button>
      <div class="pay-secure">🔒 Paiement chiffré SSL 256-bit · propulsé par <b style="color:var(--text)">VyBzzZ&nbsp;Pay</b></div>
    </div>

    <!-- Order summary -->
    <aside class="summary glass reveal" id="summary"></aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var D = window.VYBZZZ, UI = window.VYBZZZ_UI;
  var params = new URLSearchParams(location.search);
  var summary = document.getElementById("summary");

  // ----- build order -----
  var order = { title:"Pass découverte", sub:"Accès à la communauté Vybzzz", img:"assets/logo.svg", amount:0, lines:[] };
  if (params.get("event")) {
    var ev = D.events.find(function(e){return e.id == params.get("event")});
    if (ev) order = { title:(ev.name||"Live Vybzzz"), sub:(ev.live?"En direct · Vybzzz":"Vybzzz"), img:(ev.video?("https://image.mux.com/"+ev.video+"/thumbnail.jpg?width=320"):"assets/logo.svg"), amount:(ev.price||0), lines:[["Ticket",(ev.price||0)],["Replay HD inclus",0]] };
  } else if (params.get("pack")) {
    var p = D.packages.find(function(x){return x.id == params.get("pack")});
    if (p){ var total=p.points+Math.round(p.points*p.bonus/100); order = { title:p.title+" · "+total.toLocaleString("fr-FR")+" PTS", sub:(p.bonus?"+"+p.bonus+"% bonus inclus":"Pack d'Arena Points"), img:"assets/logo.svg", amount:p.price, lines:[["Arena Points",p.price]] }; }
  }
  var fee = order.amount>0 ? Math.round(order.amount*0.05*100)/100 : 0;
  var tot = Math.round((order.amount+fee)*100)/100;
  summary.innerHTML =
    '<h3 style="margin-bottom:16px">Récapitulatif</h3>'+
    '<div class="summary__item"><img src="'+order.img+'" alt=""><div><b>'+order.title+'</b><small>'+order.sub+'</small></div></div>'+
    order.lines.map(function(l){return '<div class="summary__row"><span>'+l[0]+'</span><span>'+(l[1]===0?"Inclus":"$"+l[1].toFixed(2))+'</span></div>'}).join("")+
    '<div class="summary__row"><span>Frais de service</span><span>'+(fee===0?"—":"$"+fee.toFixed(2))+'</span></div>'+
    '<div class="summary__total"><span>Total</span><span>'+(tot===0?"Gratuit":"$"+tot.toFixed(2))+'</span></div>'+
    '<p style="color:var(--muted);font-size:.8rem">En payant, tu acceptes les conditions de vente Vybzzz. Annulation possible jusqu\'à 1h avant le show.</p>';

  // ----- payment tabs -----
  var tabs = document.querySelectorAll(".pay-tab");
  var cardForm = document.getElementById("cardForm"), walletForm = document.getElementById("walletForm"), walletLabel = document.getElementById("walletLabel");
  tabs.forEach(function(t){ t.addEventListener("click", function(){
    tabs.forEach(function(x){x.classList.remove("on")}); t.classList.add("on");
    var card = t.dataset.tab==="card";
    cardForm.style.display = card?"block":"none";
    walletForm.style.display = card?"none":"block";
    if(!card){ walletLabel.textContent = ({apple:" Confirme avec Face ID / Touch ID.",google:"Paye en un tap avec Google Pay.",vybzzz:"Paye avec ton solde VyBzzZ Pay."})[t.dataset.tab]; }
  });});

  // ----- live card preview -----
  var fNum=document.getElementById("fNum"), fName=document.getElementById("fName"), fExp=document.getElementById("fExp");
  var cvNum=document.getElementById("cvNum"), cvName=document.getElementById("cvName"), cvExp=document.getElementById("cvExp"), cvBrand=document.getElementById("cvBrand");
  function brand(n){ if(/^4/.test(n))return"VISA"; if(/^5[1-5]/.test(n))return"MASTERCARD"; if(/^3[47]/.test(n))return"AMEX"; return"CARTE"; }
  fNum.addEventListener("input", function(){
    var v=fNum.value.replace(/\D/g,"").slice(0,16); fNum.value=v.replace(/(.{4})/g,"$1 ").trim();
    cvNum.textContent=(v.replace(/(.{4})/g,"$1 ").trim()||"•••• •••• •••• ••••"); cvBrand.textContent=brand(v);
  });
  fName.addEventListener("input", function(){ cvName.textContent=(fName.value||"VOTRE NOM").toUpperCase(); });
  fExp.addEventListener("input", function(){ var v=fExp.value.replace(/\D/g,"").slice(0,4); if(v.length>2)v=v.slice(0,2)+"/"+v.slice(2); fExp.value=v; cvExp.textContent=v||"MM/AA"; });

  // ----- pay -----
  document.getElementById("payBtn").addEventListener("click", function(){
    var card=document.getElementById("payCard");
    card.innerHTML='<div class="pay-success"><div class="check">✓</div><h2 style="margin-bottom:8px">Paiement confirmé</h2><p style="color:var(--muted);margin-bottom:22px">'+(tot===0?"Accès débloqué !":"Reçu envoyé par e-mail. Total : $"+tot.toFixed(2))+'</p><a class="btn btn--gold" href="'+(params.get("pack")?"store.html":"feed.html")+'"><span>'+(params.get("pack")?"Retour à la boutique":"Rejoindre le live →")+'</span></a></div>';
    UI && UI.toast("Paiement réussi 🎉");
  });
})();
</script>
</body>
</html>
