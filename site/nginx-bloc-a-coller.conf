# ═══════════════════════════════════════════════════════════════════════════
# VybzzZ — bloc à coller dans /etc/nginx/sites-enabled/vybzzz
#
# Dans le fichier, cherche le bloc :        server { server_name vybzzz.online www.vybzzz.online;
# À l'intérieur, REMPLACE ces trois lignes :
#
#     location / {
#         try_files $uri $uri/ /index.html;
#     }
#
# par TOUT ce qui suit (jusqu'à la fin du fichier).
# Ne touche à rien d'autre : ni location /api/, ni les lignes Certbot.
# ═══════════════════════════════════════════════════════════════════════════

    # www -> domaine principal (les deux noms partagent le même bloc)
    if ($host = www.vybzzz.online) { return 301 https://vybzzz.online$request_uri; }

    # Live Challenge : lien personnel d'un artiste, vybzzz.online/c/nom-de-scene
    # Passe par l'API pour que l'aperçu WhatsApp / Instagram porte SON nom.
    location ~ ^/c/([A-Za-z0-9-]+)$ {
        proxy_pass http://127.0.0.1:8002/api/challenge/invite/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Raccourci de téléchargement : vybzzz.online/app
    location = /app { return 301 /app.html; }

    # Anciennes pages supprimées
    location = /dashboard.html    { return 301 /; }
    location = /checkout.html     { return 301 /store.html; }
    location = /index-legacy.html { return 301 /; }
    location = /experience.html   { return 301 /; }

    # Cache : images longtemps, code une semaine. Le HTML n'est jamais caché,
    # sinon une mise à jour du site n'arrive pas chez les visiteurs déjà venus.
    location ~* \.(png|jpe?g|webp|svg|ico|gif|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Régie et Stage : pages privées, pas d'indexation par les moteurs
    location ~ ^/(regie|stage)\.html$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Vraie page 404 (remplace le repli silencieux sur l'accueil)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    # En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

# ═══════════════════════════════════════════════════════════════════════════
