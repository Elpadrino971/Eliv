<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070C18" />
<meta name="referrer" content="strict-origin" />
<title>VybzzZ · Concerts en direct</title>
<meta name="description" content="VybzzZ dans ton navigateur : concerts en direct, clips, billets. Le même compte que dans l'application." />
<link rel="icon" href="../favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="../assets/brand/apple-touch-icon.png">
<script>if(location.hostname==='www.vybzzz.online'){location.replace('https://vybzzz.online'+location.pathname+location.search+location.hash)}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --night:#070C18;--navy:#0A1226;--panel:#101A33;--panel-2:#152143;--line:rgba(230,199,106,.16);--line-soft:rgba(244,239,227,.1);
  --gold:#E6C76A;--ivory:#F4EFE3;--muted:#A9B1C4;--live:#E23B4E;--ok:#41D67E;--err:#FFB4BC;
  --radius:16px;--ease:cubic-bezier(.22,1,.36,1);--tabbar:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--night);color:var(--ivory)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Barre du haut */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(7,12,24,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.logo{font-family:Sora,sans-serif;font-weight:800;letter-spacing:.14em;font-size:1rem}
.logo span{color:var(--gold)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.92rem}
.nav a[aria-current="page"]{color:var(--ivory);background:var(--panel)}
.top__right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:.88rem;background:transparent;cursor:pointer;white-space:nowrap}
@media (max-width:520px){.pill--gold{display:none}}
.pill--gold{background:var(--gold);color:var(--navy);border-color:transparent}
@media (max-width:520px){.hide-sm{display:none}}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--gold);overflow:hidden}

/* Barre d'onglets (mobile) */
.tabbar{display:none}
@media (max-width:760px){
  .nav{display:none}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(7,12,24,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft)}
  .tabbar a{display:grid;place-items:center;align-content:center;gap:3px;color:var(--muted);font-size:.7rem;font-weight:600}
  .tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a[aria-current="page"]{color:var(--gold)}
  main{padding-bottom:calc(var(--tabbar) + 24px + env(safe-area-inset-bottom))}
}

main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.view-feed main,.view-feed{padding:0}
h1,h2,h3{font-family:Sora,sans-serif;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(1.5rem,3.6vw,2.2rem)}
h2{font-size:1.2rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sec{margin-top:30px}
.sec:first-child{margin-top:0}
.dot-live{width:9px;height:9px;border-radius:50%;background:var(--live);display:inline-block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Cartes concert */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,280px);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:block;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;scroll-snap-align:start;transition:transform .2s var(--ease),border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--line)}
.card__img{position:relative;aspect-ratio:4/5;background:var(--panel-2) center/cover no-repeat}
.card__badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.06em;background:rgba(7,12,24,.75)}
.card__badge--live{background:var(--live);color:#fff}
.card__body{padding:12px 14px 14px;display:grid;gap:3px}
.card__title{font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__meta{color:var(--muted);font-size:.85rem}
.card__price{color:var(--gold);font-weight:700;font-size:.9rem;margin-top:4px}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center;background:linear-gradient(135deg,var(--panel),var(--navy));border:1px solid var(--line);border-radius:22px;overflow:hidden}
.hero__img{aspect-ratio:4/5;background:var(--panel-2) center/cover no-repeat;max-height:460px}
.hero__txt{padding:24px 24px 24px 0;display:grid;gap:12px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero__txt{padding:0 18px 20px}.hero__img{max-height:none;aspect-ratio:4/4}}

.artists{display:grid;grid-auto-flow:column;grid-auto-columns:92px;gap:14px;overflow-x:auto;padding-bottom:6px}
.artist{display:grid;justify-items:center;gap:8px;text-align:center;font-size:.82rem;font-weight:600}
.artist img,.artist .ph{width:78px;height:78px;border-radius:50%;object-fit:cover;background:var(--panel-2);border:2px solid var(--line)}
.artist .ph{display:grid;place-items:center;font-family:Sora,sans-serif;color:var(--gold);font-size:1.4rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:1rem;cursor:pointer;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ivory)}
.btn-block{width:100%}
.empty{padding:26px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--panel) 0%,var(--panel-2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite;border-radius:var(--radius)}
@keyframes sk{to{background-position:-200% 0}}

/* Formulaires */
.form-wrap{max-width:420px;margin:12px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:grid;gap:14px}
form{display:grid;gap:10px}
label{font-size:.85rem;color:var(--muted)}
input{width:100%;background:var(--night);border:1px solid rgba(244,239,227,.18);border-radius:12px;padding:13px 14px;font-size:1rem}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent}
.msg{font-size:.9rem;color:var(--err)}
.msg.ok{color:var(--ok)}
.msg:empty{display:none}
.link{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0;font-size:.92rem}
.center{text-align:center}

/* Fiche concert */
.ev{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:start}
.ev__cover{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
.ev__cover img{width:100%;height:auto}
.ev__info{display:grid;gap:14px}
.ev__artist{display:flex;align-items:center;gap:10px;font-weight:600}
.ev__artist img,.ev__artist .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--panel-2)}
.ev__artist .ph,.clip__artist .ph{display:grid;place-items:center;color:var(--gold);font-family:Sora,sans-serif}
.ev__box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px}
.ev__price{font-family:Sora,sans-serif;font-size:1.7rem;color:var(--gold);font-weight:800}
.ev__desc{color:var(--muted);white-space:pre-line}
@media (max-width:760px){.ev{grid-template-columns:1fr}}

/* Feed vertical */
.feed{height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
@media (max-width:760px){.feed{height:calc(100dvh - 58px - var(--tabbar) - env(safe-area-inset-bottom))}}
.clip{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;overflow:hidden}
.clip video{width:100%;height:100%;object-fit:contain;background:#000}
.clip__info{position:absolute;left:0;right:70px;bottom:0;padding:18px 16px 22px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);display:grid;gap:4px}
.clip__artist{font-weight:700;display:flex;align-items:center;gap:8px}
.clip__artist img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}
.clip__side{position:absolute;right:12px;bottom:26px;display:grid;gap:14px;justify-items:center}
.round{width:46px;height:46px;border-radius:50%;border:0;background:rgba(7,12,24,.6);display:grid;place-items:center;cursor:pointer}
.round svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feed__tabs{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:10px;pointer-events:none;height:0;overflow:visible}
.feed__tabs button{pointer-events:auto;background:rgba(7,12,24,.6);border:1px solid var(--line-soft);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;cursor:pointer;height:fit-content}
.feed__tabs button[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:transparent}

/* Artiste */
.pro{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pro img,.pro .ph{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--panel-2);border:2px solid var(--gold)}
.pro .ph{display:grid;place-items:center;font-family:Sora,sans-serif;font-size:2rem;color:var(--gold)}
.clipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.clipgrid a{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--panel-2) center/cover no-repeat}

.list{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:10px}
.item__img{width:64px;height:80px;border-radius:10px;background:var(--panel-2) center/cover no-repeat;flex:none}
.item__body{flex:1;min-width:0;display:grid;gap:2px}
.item__title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 24px);transform:translateX(-50%);z-index:60;background:var(--panel-2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/">VYBZZ<span>Z</span></a>
  <nav class="nav" aria-label="Navigation principale">
    <a href="#/" data-tab="home">Accueil</a>
    <a href="#/feed" data-tab="feed">Feed</a>
    <a href="#/tickets" data-tab="tickets">Mes billets</a>
  </nav>
  <div class="top__right" id="topRight"></div>
</header>

<main id="view"></main>

<nav class="tabbar" aria-label="Onglets">

  <a href="#/feed" data-tab="feed"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 9.5l4 2.5-4 2.5z"/></svg>Feed</a>
  <a href="#/tickets" data-tab="tickets"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v12" stroke-dasharray="2 2"/></svg>Billets</a>
  <a href="#/account" data-tab="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Compte</a>
</nav>

<div class="toast" id="toast" hidden role="status"></div>

<script src="../vendor/hls.min.js"></script>

</html>
